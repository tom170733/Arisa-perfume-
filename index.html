<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISA PERFUME STORE | Luxury Scents</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        body { background-color: #ffffff; color: #1a1a1a; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #ffffff; border-bottom: 1px solid #d4af37; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a { text-decoration: none; color: #1a1a1a; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        
        /* Product Boxes */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px 5%; }
        .product-card { background: white; padding: 10px; text-align: center; border: 1px solid #d4af37; border-radius: 5px; box-shadow: 3px 3px 10px rgba(0,0,0,0.05); }
        .product-image img { width: 100%; height: 180px; object-fit: contain; }
        .btn { padding: 10px; background: #1a1a1a; color: white; border: none; cursor: pointer; width: 100%; margin-top: 10px; text-transform: uppercase; font-size: 10px; }
        .btn:hover { background: #d4af37; }

        /* Cart Summary Panel */
        .cart-summary { background: #fafafa; padding: 20px 5%; border-top: 1px solid #d4af37; text-align: center; }
        .discount-tag { color: #d4af37; font-weight: bold; font-size: 14px; margin-top: 5px; display: block; }
        
        .search-section { text-align: center; padding: 30px; background: #f9f9f9; }
        .search-input { width: 80%; max-width: 400px; padding: 10px; border-radius: 20px; border: 1px solid #0047AB; text-align: center; }
        footer { background: #000; color: white; text-align: center; padding: 20px; font-size: 10px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo" onclick="location.reload()">ARISA</div>
        <ul class="nav-links">
            <li><a href="#home-content">Home</a></li>
            <li style="font-weight: bold;">BAG (<span id="cart-counter">0</span>)</li>
        </ul>
    </nav>

    <div id="home-content">
        <h2 style="text-align: center; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px;">Our Collection</h2>
        <div class="product-grid" id="product-grid"></div>
    </div>

    <div class="cart-summary">
        <h3>Estimated Total: <span id="cart-total">0</span> NLE</h3>
        <span id="discount-message" class="discount-tag">Buy 2 for 5% off | Buy 3+ for 10% off!</span>
    </div>

    <section class="search-section">
        <input type="text" id="perfume-search" class="search-input" placeholder="Search for a scent..." onkeyup="filterProducts()">
    </section>

    <footer>
        <p>&copy; 2026 ARISA PERFUME STORE</p>
        <button onclick="loginAdmin()" style="background:none; border:none; color:#555; cursor:pointer;">Staff Login</button>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD6VOairMfPk1fM9VApccmNEPAdMIb3HO4",
            authDomain: "arisa-perfume-store.firebaseapp.com",
            databaseURL: "https://arisa-perfume-store-default-rtdb.firebaseio.com",
            projectId: "arisa-perfume-store",
            storageBucket: "arisa-perfume-store.firebasestorage.app",
            messagingSenderId: "49919010733",
            appId: "1:49919010733:web:2087407e3f6bd41c1fe324"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let perfumes = [];
        let bag = [];

        function addToBag(name, price) {
            bag.push({ name, price: parseFloat(price) });
            updateCartDisplay();
            alert(name + " added to bag!");
        }

        function updateCartDisplay() {
            const count = bag.length;
            document.getElementById('cart-counter').innerText = count;

            let subtotal = bag.reduce((sum, item) => sum + item.price, 0);
            let discount = 0;
            let message = "Buy 2 for 5% off | Buy 3+ for 10% off!";

            if (count === 2) {
                discount = 0.05;
                message = "5% Discount Applied!";
            } else if (count >= 3) {
                discount = 0.10;
                message = "10% Bulk Discount Applied!";
            }

            let finalTotal = subtotal * (1 - discount);
            document.getElementById('cart-total').innerText = finalTotal.toFixed(2);
            document.getElementById('discount-message').innerText = message;
        }

        db.ref('perfumes').on('value', (snapshot) => {
            const data = snapshot.val();
            perfumes = [];
            if (data) {
                Object.keys(data).forEach(key => perfumes.push({ id: key, ...data[key] }));
            }
            renderProducts(perfumes);
        });

        function renderProducts(list) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-image"><img src="${p.image}"></div>
                        <h3 style="font-size:12px;">${p.name}</h3>
                        <p style="color:#d4af37;">${p.price} NLE</p>
                        <button class="btn" onclick="addToBag('${p.name}', '${p.price}')">Add to Bag</button>
                    </div>`;
            });
        }

        function loginAdmin() {
            const pass = prompt("Staff Password:");
            if(pass === "@Thomas74170733") window.location.href = "admin.html";
        }

        function filterProducts() {
            const term = document.getElementById('perfume-search').value.toLowerCase();
            renderProducts(perfumes.filter(p => p.name.toLowerCase().includes(term)));
        }
    </script>
</body>
</html>
