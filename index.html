
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARISA COLLECTION | PRO</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg-color: #f8fafc; --text-dark: #0f172a; --accent-primary: #ff6b8b; }
        body { background-color: var(--bg-color); color: var(--text-dark); transition: background 0.3s; font-family: sans-serif; }
        
        /* Navigation Line Effect */
        nav a { position: relative; padding-bottom: 5px; cursor: pointer; }
        nav a.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--accent-primary); }
        
        .admin-controls { background: #fff; padding: 20px; border: 2px solid var(--accent-primary); margin: 20px; }
        .theme-picker { position: fixed; top: 10px; right: 10px; background: white; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- Theme Picker -->
    <div class="theme-picker">
        <label>Theme Color:</label>
        <input type="color" onchange="document.body.style.backgroundColor = this.value">
    </div>

    <header style="text-align:center; padding:20px;">
        <h1>ARISA COLLECTION</h1>
        <nav id="main-nav">
            <a class="active" onclick="showTab('home', this)">HOME</a>
            <a onclick="showTab('about', this)">ABOUT</a>
            <a onclick="showTab('policy', this)">POLICY</a>
        </nav>
    </header>

    <div id="content-area" style="padding:20px;">
        <!-- Admin Panel for Editing -->
        <div id="admin-panel" class="admin-controls" style="display:none;">
            <h3>ADMIN CONTROL PANEL</h3>
            <input type="text" id="edit-id" placeholder="Product ID to Edit">
            <input type="text" id="edit-name" placeholder="New Product Name">
            <button onclick="updateProduct()">UPDATE NAME</button>
        </div>

        <div id="product-grid"></div>
    </div>

    <script>
        const firebaseConfig = { /* PASTE YOUR CONFIG HERE */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('perfumes');
        const SECURITY_KEY = "AMIRA_SECURE_KEY_2026";

        // ShowTab with Line Indicator
        function showTab(tab, element) {
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            element.classList.add('active');
            // Logic to toggle content divs goes here
        }

        // Edit Product Name
        function updateProduct() {
            const id = document.getElementById('edit-id').value;
            const newName = document.getElementById('edit-name').value;
            db.child(id).update({ name: newName, secretAdminKey: SECURITY_KEY });
        }

        // Discount Logic
        function calculateTotal(cart) {
            let subtotal = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
            if (cart.length >= 3) return subtotal * 0.90; // 10% off
            if (cart.length >= 2) return subtotal * 0.95; // 5% off
            return subtotal;
        }

        // Listen for data
        db.on('value', (snap) => {
            const data = snap.val();
            // Render grid dynamically...
        });
    </script>
</body>
</html>
