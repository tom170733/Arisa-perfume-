
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISA COLLECTION | LIVE PREMIUM SHOWROOM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.bundle.min.js/5.0.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-primary: #ff6b8b; /* Default Theme Pink */
            --accent-light: #fff1f2;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 80px;
        }

        /* --- PREMIUM NEON BLUE PRELOADER SCREEN --- */
        #app-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0f19;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }
        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glow-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid #00a2ff;
            border-right: 4px solid #0055ff;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.5), inset 0 0 15px rgba(0, 85, 255, 0.3);
            animation: spinNeon 1.2s linear infinite;
        }
        .loading-text {
            position: absolute;
            color: #00a2ff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 162, 255, 0.8);
        }
        @keyframes spinNeon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        header {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        header h1 {
            color: var(--text-dark);
            font-size: 22px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 14px;
        }
        header h1 span { color: var(--accent-primary); transition: color 0.3s ease; }
        nav { display: flex; justify-content: center; gap: 24px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            padding-bottom: 4px;
        }
        nav a.active { color: var(--text-dark); }
        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-primary);
        }

        /* Top Theme Selector Configuration */
        .theme-selector-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .theme-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px;}
        .theme-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #cbd5e1;
            transition: transform 0.2s ease;
        }
        .theme-dot.active { transform: scale(1.2); box-shadow: 0 0 0 2px var(--text-dark); }
        .dot-pink { background: #ff6b8b; }
        .dot-blue { background: #1e3a8a; }
        .dot-white { background: #ffffff; box-shadow: inset 0 0 4px rgba(0,0,0,0.15), 0 0 0 1px #cbd5e1; }

        .section-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }
        .sec-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            flex: 1;
            max-width: 180px;
            text-align: center;
        }
        .sec-btn.active {
            background: var(--text-dark);
            color: #ffffff;
            border-color: var(--text-dark);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px 8px; }
        
        /* 2 PRODUCTS PER ROW ON MOBILE MOBILE SYSTEM */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }
        .product-image {
            width: 100%;
            height: 160px;
            background: #f8fafc;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .status-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 700;
            z-index: 2;
        }
        .status-badge.available { background: #e2f8f0; color: #065f46; }
        .status-badge.sold-out { background: #fee2e2; color: #991b1b; }
        
        .new-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 700;
            background: var(--accent-primary);
            color: #ffffff;
            z-index: 2;
        }
        .product-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-container { margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; margin-bottom: 8px; }
        .price-current { font-weight: 800; font-size: 14px; color: var(--text-dark); }
        .price-old { text-decoration: line-through; color: var(--text-muted); font-size: 10px; }
        .discount-tag { color: var(--accent-primary); font-size: 9px; font-weight: 700; width: 100%; }
        
        .btn {
            background: var(--accent-primary);
            border: none;
            color: #ffffff;
            width: 100%;
            padding: 10px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

        #floating-cart-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--text-dark);
            color: #ffffff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: none;
        }
        #floating-cart-counter {
            position: absolute;
            top: -2px;
            left: -2px;
            background: var(--accent-primary);
            color: white;
            font-size: 9px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #ffffff;
            border-left: 1px solid var(--border-color);
            z-index: 300;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        .close-sidebar-btn { background: transparent; border: none; font-size: 26px; cursor: pointer; color: var(--text-muted); }
        
        .cart-scroll-area { flex-grow: 1; overflow-y: auto; margin-bottom: 16px; }
        .cart-item-row { border-bottom: 1px solid var(--border-color); padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .remove-item-btn { background: transparent; border: none; color: #dc2626; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 4px; display: block; }
        
        .checkout-inputs { background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .checkout-inputs label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 4px; }
        .checkout-inputs input, .checkout-inputs select, .checkout-inputs textarea { width: 100%; padding: 8px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 10px; outline: none; }
        
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        
        .admin-box { background: #ffffff; border: 1px solid var(--text-dark); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        .admin-box h2 { font-size: 12px; margin-bottom: 12px; font-weight: 800; text-transform: uppercase; border-bottom: 2px solid var(--text-dark); padding-bottom: 6px; }
        .admin-grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
        .admin-grid-inputs input, .admin-grid-inputs select { border: 1px solid #cbd5e1; padding: 9px; font-size: 12px; border-radius: 6px; outline: none; }
    </style>
</head>
<body>

    <!-- Dynamic Neon Preloader Screen -->
    <div id="app-preloader">
        <div class="spinner-container">
            <div class="glow-ring"></div>
            <div class="loading-text">LOADING</div>
        </div>
    </div>

    <header>
        <h1 onclick="showHome()">ARISA <span id="logo-span">COLLECTION</span></h1>
        <nav>
            <a onclick="showHome()" id="nav-home" class="active">HOME</a>
            <a onclick="showAbout()" id="nav-about">ABOUT</a>
            <a onclick="showPolicy()" id="nav-policy">POLICY</a>
            <a onclick="toggleCart()">CART (<span id="cart-counter">0</span>)</a>
        </nav>
    </header>

    <!-- Global Top Level Screen Customization Panel -->
    <div class="theme-selector-bar">
        <span class="theme-label">SCREEN LAYOUT:</span>
        <div class="theme-dot dot-pink active" id="dot-pink" onclick="changeGlobalTheme('Pink')"></div>
        <div class="theme-dot dot-blue" id="dot-blue" onclick="changeGlobalTheme('Blue')"></div>
        <div class="theme-dot dot-white" id="dot-white" onclick="changeGlobalTheme('White')"></div>
    </div>

    <div class="section-bar" id="category-section-bar">
        <button class="sec-btn active" id="sec-perfume" onclick="switchSection('perfume')">Perfumes & Body Care</button>
        <button class="sec-btn" id="sec-clothing" onclick="switchSection('clothing')">Clothing & Apparel</button>
    </div>

    <div class="container">
        <div id="home-content">
            
            <!-- Live Cloud Admin Panel Interface -->
            <div id="admin-panel" class="admin-box" style="display:none;">
                <h2>LIVE INVENTORY MANAGER (CLOUD SYNC ACTIVE)</h2>
                <div class="admin-grid-inputs">
                    <input type="text" id="admin-p-name" placeholder="Product Name">
                    <input type="number" id="admin-p-price" placeholder="Base Price (NLE)">
                    <input type="number" id="admin-p-discount-percentage" placeholder="Discount % (Optional)">
                    <select id="admin-p-status">
                        <option value="available">Available Status</option>
                        <option value="sold-out">Sold Out Status</option>
                    </select>
                    <select id="admin-p-arrival">
                        <option value="no">Regular Stock</option>
                        <option value="yes">New Arrival Label</option>
                    </select>
                    <select id="admin-p-category">
                        <option value="perfume">Perfumes & Body Care</option>
                        <option value="clothing">Clothing & Apparel</option>
                    </select>
                </div>
                <div style="margin-bottom:16px; background:#f8fafc; padding:10px; border-radius:6px; border:1px dashed #cbd5e1;">
                    <label style="font-size:10px; color:var(--text-muted); display:block; margin-bottom:4px; font-weight:700; text-transform:uppercase;">Snap or Upload Product Photo:</label>
                    <input type="file" id="admin-p-file" accept="image/*" style="font-size:11px;">
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn" id="admin-save-btn" style="background:var(--text-dark); padding:12px;" onclick="adminUploadLive()">PUBLISH LIVE FOR CUSTOMERS</button>
                    <button class="btn" style="background:#e2e8f0; color:var(--text-dark); padding:12px; max-width:120px;" onclick="logoutAdmin()">EXIT SESSION</button>
                </div>
            </div>

            <!-- Product catalog layout: Configured for 2 columns per row -->
            <div class="product-grid" id="products-catalogue-grid"></div>
            
            <div style="text-align:center; margin-top:60px; padding: 20px; opacity: 0.15;" onclick="handleSecretAdminTap()">
                <span style="font-size: 10px; color: var(--text-muted); cursor: pointer;">[ ARISA LIVE BROADCAST CONTROL ]</span>
            </div>
        </div>

        <div id="page-content" style="display:none; background:var(--card-bg); border:1px solid var(--border-color); padding:24px; border-radius:8px; margin-top:10px; line-height:1.6;">
            <div id="page-inner-content"></div>
            <button class="btn" style="margin-top:20px; max-width:140px; background:var(--text-dark);" onclick="showHome()">Return Home</button>
        </div>
    </div>

    <button id="floating-cart-btn" onclick="toggleCart()">🛍️ <span id="floating-cart-counter">0</span></button>

    <div class="sidebar" id="cart-sidebar">
        <div class="sidebar-header">
            <h2>SHOPPING BAG</h2>
            <button class="close-sidebar-btn" onclick="toggleCart()">×</button>
        </div>
        
        <div class="cart-scroll-area"><div id="cart-items-list"></div></div>

        <div class="checkout-inputs">
            <label>Customer Name</label>
            <input type="text" id="cust-name" placeholder="Enter recipient name">
            <label>WhatsApp Number</label>
            <input type="tel" id="cust-phone" placeholder="e.g. +23277000000">
            <label>Fulfillment Setup</label>
            <select id="order-method" onchange="handleOrderMethodChange()">
                <option value="Delivery">Courier Delivery</option>
                <option value="Pick Up">Showroom Pick Up</option>
            </select>
            <div id="address-input-wrapper">
                <label>Pinpoint Address</label>
                <textarea id="cust-address" rows="2" placeholder="Street layout details..."></textarea>
            </div>
            <label>Payment Mode</label>
            <select id="payment-method">
                <option value="Orange Money">Orange Money</option>
                <option value="Afrimoney">Afrimoney</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
            </select>
        </div>

        <div style="border-top:1px solid var(--border-color); padding-top:12px; margin-bottom:16px;">
            <div class="summary-row">
                <span style="color:var(--text-muted)">Subtotal:</span>
                <span style="font-weight:600;"><span id="cart-subtotal">0.00</span> NLE</span>
            </div>
            <div class="summary-row" style="font-size:15px; font-weight:800; border-top:1px solid var(--border-color); margin-top:8px; padding-top:8px;">
                <span>Total Due:</span>
                <span><span id="cart-grand-total">0.00</span> NLE</span>
            </div>
        </div>
        <button class="btn" style="padding:12px;" onclick="checkoutWhatsApp()">COMPLETE & SEND WHATSAPP MESSAGE</button>
    </div>

    <script>
        const myWhatsAppNumber = "23274646545"; 
        const cloudStorageUrl = "https://kvdb.io/MN74qTqWv9Z3x8w7KqL5aG/arisa_store_catalog";

        let itemsCollection = []; 
        let cart = [];
        let currentSection = 'perfume'; 
        let secretClickCount = 0;
        let activeTheme = 'Pink';

        // Handles dynamic interface skin switching across screens
        window.changeGlobalTheme = function(themeName) {
            activeTheme = themeName;
            const root = document.documentElement;
            
            document.getElementById('dot-pink').classList.remove('active');
            document.getElementById('dot-blue').classList.remove('active');
            document.getElementById('dot-white').classList.remove('active');
            document.getElementById('dot-' + themeName.toLowerCase()).classList.add('active');

            if (themeName === 'Pink') {
                root.style.setProperty('--accent-primary', '#ff6b8b');
                root.style.setProperty('--bg-color', '#f8fafc');
                root.style.setProperty('--card-bg', '#ffffff');
                root.style.setProperty('--text-dark', '#0f172a');
                root.style.setProperty('--border-color', '#e2e8f0');
            } else if (themeName === 'Blue') {
                root.style.setProperty('--accent-primary', '#2563eb');
                root.style.setProperty('--bg-color', '#f0f4f8');
                root.style.setProperty('--card-bg', '#ffffff');
                root.style.setProperty('--text-dark', '#1e293b');
                root.style.setProperty('--border-color', '#cbd5e1');
            } else if (themeName === 'White') {
                root.style.setProperty('--accent-primary', '#0f172a');
                root.style.setProperty('--bg-color', '#ffffff');
                root.style.setProperty('--card-bg', '#f8fafc');
                root.style.setProperty('--text-dark', '#0f172a');
                root.style.setProperty('--border-color', '#e2e8f0');
            }
            
            // Re-render components to inherit theme styling rules
            renderProducts();
            updateCartUI();
        };

        async function fetchLiveCloudCatalog() {
            const preloader = document.getElementById('app-preloader');
            try {
                const response = await fetch(cloudStorageUrl);
                if (response.ok) {
                    itemsCollection = await response.json();
                } else {
                    itemsCollection = [];
                }
            } catch (error) {
                console.log("Loading baseline profile data setup...");
                itemsCollection = [
                    { id: "1", name: "Premium Oud Sample", price: "450", discountPercentage: "", status: "available", isNewArrival: "yes", category: "perfume", image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23eff6ff'/><text x='50%' y='55%' font-family='sans-serif' font-size='10' text-anchor='middle' fill='%231e3a8a'>No Photo</text></svg>" }
                ];
            }
            renderProducts();
            
            preloader.style.opacity = '0';
            setTimeout(() => preloader.style.display = 'none', 400);
        }

        window.onload = function() {
            fetchLiveCloudCatalog();
            if (sessionStorage.getItem('isArisaAdmin') === 'true') {
                document.getElementById('admin-panel').style.display = 'block';
            }
        };

        async function pushLiveCloudCatalog() {
            try {
                await fetch(cloudStorageUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(itemsCollection)
                });
            } catch (e) {
                alert("Cloud configuration sync error.");
            }
        }

        function switchSection(sectionName) {
            currentSection = sectionName;
            document.getElementById('sec-perfume').classList.remove('active');
            document.getElementById('sec-clothing').classList.remove('active');
            document.getElementById('sec-' + sectionName).classList.add('active');
            renderProducts();
        }

        function handleSecretAdminTap() {
            secretClickCount++;
            if (secretClickCount >= 3) {
                secretClickCount = 0;
                loginAdmin();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('products-catalogue-grid');
            grid.innerHTML = '';
            const isAdmin = sessionStorage.getItem('isArisaAdmin') === 'true';
            const filteredItems = itemsCollection.filter(item => item.category === currentSection);

            if (filteredItems.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; font-size:12px; color:var(--text-muted); text-align:center; padding:48px 0;">No active storefront allocations found.</p>`;
                return;
            }

            filteredItems.forEach(p => {
                const sold = p.status === 'sold-out';
                const originalPrice = parseFloat(p.price);
                let priceDisplayHTML = '';

                if (p.discountPercentage && parseFloat(p.discountPercentage) > 0) {
                    let pct = parseFloat(p.discountPercentage);
                    let finalPrice = originalPrice - (originalPrice * (pct / 100));
                    priceDisplayHTML = `
                        <div class="price-container">
                            <span class="price-current">${finalPrice.toFixed(2)} NLE</span>
                            <span class="price-old">${originalPrice.toFixed(2)} NLE</span>
                            <span class="discount-tag">${pct}% OFF</span>
                        </div>`;
                } else {
                    priceDisplayHTML = `<div class="price-container"><span class="price-current">${originalPrice.toFixed(2)} NLE</span></div>`;
                }

                // Cards are clean, click triggers direct cart allocation
                grid.innerHTML += `
                    <div class="product-card" onclick="${sold ? '' : `directAddToCart('${p.id}')`}">
                        <span class="status-badge ${p.status}">${p.status}</span>
                        ${p.isNewArrival === 'yes' ? '<span class="new-badge">NEW</span>' : ''}
                        <div class="product-image"><img src="${p.image}"></div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            ${priceDisplayHTML}
                            <button class="btn" ${sold ? 'disabled' : ''}>${sold ? 'OUT OF STOCK' : 'ADD TO CART'}</button>
                        </div>
                        ${isAdmin ? `<div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:8px; border-top:1px solid #e2e8f0; padding-top:6px;">
                            <button class="btn" style="background:#dc2626; font-size:9px; padding:4px 0;" onclick="event.stopPropagation(); deleteProductLive('${p.id}')">Delete</button>
                            <button class="btn" style="background:#2563eb; font-size:9px; padding:4px 0;" onclick="event.stopPropagation(); toggleStatusLive('${p.id}')">Toggle</button>
                        </div>` : ''}
                    </div>`;
            });
        }

        // Fast actions - skip selection pop-ups entirely
        window.directAddToCart = (productId) => {
            const item = itemsCollection.find(p => p.id === productId);
            if (!item || item.status === 'sold-out') return;
            
            cart.push({ ...item, cartId: Date.now() }); 
            updateCartUI();
            document.getElementById('floating-cart-btn').style.display = 'block';
        };

        // Customer can completely remove target mistakes out of inventory rows
        window.removeCartItem = (cartId) => {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartUI();
            if (cart.length === 0) {
                document.getElementById('floating-cart-btn').style.display = 'none';
                document.getElementById('cart-sidebar').style.display = 'none';
            }
        };

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            document.getElementById('floating-cart-counter').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            let subtotal = 0;

            list.innerHTML = cart.map(i => {
                const base = parseFloat(i.price);
                const final = i.discountPercentage ? (base - (base * (parseFloat(i.discountPercentage)/100))) : base;
                subtotal += final;
                return `
                    <div class="cart-item-row">
                        <div>
                            <h4 style="font-size:13px; font-weight:700;">${i.name}</h4>
                            <button class="remove-item-btn" onclick="removeCartItem(${i.cartId})">❌ Remove</button>
                        </div>
                        <span style="font-size:13px; font-weight:800;">${final.toFixed(2)} NLE</span>
                    </div>`;
            }).join('');

            document.getElementById('cart-subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('cart-grand-total').innerText = subtotal.toFixed(2);
        }

        window.adminUploadLive = function() {
            const name = document.getElementById('admin-p-name').value.trim();
            const price = document.getElementById('admin-p-price').value.trim();
            const discountPct = document.getElementById('admin-p-discount-percentage').value.trim();
            const status = document.getElementById('admin-p-status').value;
            const isArrival = document.getElementById('admin-p-arrival').value;
            const category = document.getElementById('admin-p-category').value;
            const fileInput = document.getElementById('admin-p-file');
            
            if (!name || !price) {
                alert("Please fill in the Name and Price input fields.");
                return;
            }

            const saveBtn = document.getElementById('admin-save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = "COMPRESSING IMAGE & SYNCING LIVE...";

            const finalizePush = async (imageString) => {
                const newProduct = {
                    id: Date.now().toString(),
                    name: name,
                    price: price,
                    discountPercentage: discountPct,
                    status: status,
                    isNewArrival: isArrival,
                    category: category,
                    image: imageString
                };
                
                itemsCollection.push(newProduct);
                await pushLiveCloudCatalog();
                
                document.getElementById('admin-p-name').value = '';
                document.getElementById('admin-p-price').value = '';
                document.getElementById('admin-p-discount-percentage').value = '';
                fileInput.value = '';
                
                saveBtn.disabled = false;
                saveBtn.innerText = "PUBLISH LIVE FOR CUSTOMERS";
                renderProducts();
                alert("Success! Product is live in your shop.");
            };

            if (fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 350; 
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        finalizePush(canvas.toDataURL('image/jpeg', 0.60));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                finalizePush("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23eff6ff'/><text x='50%' y='55%' font-family='sans-serif' font-size='10' text-anchor='middle' fill='%231e3a8a'>No Image</text></svg>");
            }
        };

        window.deleteProductLive = async function(id) {
            if(confirm("Permanently delete this item from the live store catalog?")) {
                itemsCollection = itemsCollection.filter(p => p.id !== id);
                await pushLiveCloudCatalog();
                renderProducts();
            }
        };

        window.toggleStatusLive = async function(id) {
            itemsCollection = itemsCollection.map(p => {
                if(p.id === id) {
                    p.status = p.status === 'available' ? 'sold-out' : 'available';
                }
                return p;
            });
            await pushLiveCloudCatalog();
            renderProducts();
        };

        window.toggleCart = () => {
            const el = document.getElementById('cart-sidebar');
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
        };

        window.handleOrderMethodChange = () => {
            document.getElementById('address-input-wrapper').style.display = 
                (document.getElementById('order-method').value === 'Pick Up') ? 'none' : 'block';
        };

        window.loginAdmin = () => {
            if (prompt("Enter Control Verification Password:") === "AMIRA") {
                sessionStorage.setItem('isArisaAdmin', 'true');
                document.getElementById('admin-panel').style.display = 'block';
                renderProducts();
            }
        };

        window.logoutAdmin = () => {
            sessionStorage.removeItem('isArisaAdmin');
            document.getElementById('admin-panel').style.display = 'none';
            renderProducts();
        };

        window.checkoutWhatsApp = () => {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const grandTotal = document.getElementById('cart-grand-total').innerText;
            if(!name || !phone || cart.length === 0) return;

            let msg = `*ARISA COLLECTION ORDER*\nCustomer: ${name}\nPhone: ${phone}\nTotal: ${grandTotal} NLE\n\n*Items:*\n`;
            cart.forEach(i => { msg += `• ${i.name}\n`; });

            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(msg)}`, '_blank');
            cart = [];
            updateCartUI();
            toggleCart();
            document.getElementById('floating-cart-btn').style.display = 'none';
        };

        window.showHome = () => {
            document.getElementById('home-content').style.display = 'block';
            document.getElementById('page-content').style.display = 'none';
            document.getElementById('category-section-bar').style.display = 'flex';
        };
        window.showAbout = () => {
            document.getElementById('home-content').style.display = 'none';
            document.getElementById('category-section-bar').style.display = 'none';
            document.getElementById('page-content').style.display = 'block';
            document.getElementById('page-inner-content').innerHTML = `<h2>ABOUT ARISA</h2><p>Premium live catalog tailored for direct smartphone administration.</p>`;
        };
        window.showPolicy = () => {
            document.getElementById('home-content').style.display = 'none';
            document.getElementById('category-section-bar').style.display = 'none';
            document.getElementById('page-content').style.display = 'block';
            document.getElementById('page-inner-content').innerHTML = `<h2>STORE POLICY</h2><p>All items checked through automated checkout and finalized instantly via WhatsApp delivery lines.</p>`;
        };
    </script>
</body>
</html>
