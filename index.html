
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISA COLLECTION | PREMIUM SHOWROOM</title>
    
    <!-- Core Firebase SDK Modules (Free Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-primary: #ff6b8b; 
            --accent-light: #fff1f2;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 80px;
        }

        #app-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0f19;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }
        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glow-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid #ff6b8b;
            border-right: 4px solid #ff477e;
            box-shadow: 0 0 15px rgba(255, 107, 139, 0.5);
            animation: spinNeon 1.2s linear infinite;
        }
        .loading-text {
            position: absolute;
            color: #ff6b8b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        @keyframes spinNeon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        header {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        header h1 {
            color: var(--text-dark);
            font-size: 22px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 14px;
        }
        header h1 span { color: var(--accent-primary); }
        nav { display: flex; justify-content: center; gap: 24px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            padding-bottom: 4px;
        }
        nav a.active { color: var(--text-dark); }
        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-primary);
        }

        .section-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }
        .sec-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            flex: 1;
            max-width: 180px;
            text-align: center;
        }
        .sec-btn.active {
            background: var(--text-dark);
            color: #ffffff;
            border-color: var(--text-dark);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px 8px; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }
        .product-image {
            width: 100%;
            height: 160px;
            background: #f8fafc;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .status-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 700;
            z-index: 2;
        }
        .status-badge.available { background: #e2f8f0; color: #065f46; }
        .status-badge.sold-out { background: #fee2e2; color: #991b1b; }
        
        .new-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 700;
            background: var(--accent-primary);
            color: #ffffff;
            z-index: 2;
        }
        .product-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-container { margin-top: auto; padding-top: 4px; display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
        .price-row-flex { display: flex; align-items: baseline; gap: 6px; }
        .price-current { font-weight: 800; font-size: 14px; color: var(--text-dark); }
        .price-old { text-decoration: line-through; color: var(--text-muted); font-size: 10px; }
        
        .btn {
            background: var(--accent-primary);
            border: none;
            color: #ffffff;
            width: 100%;
            padding: 10px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

        #floating-cart-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--text-dark);
            color: #ffffff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: none;
        }
        #floating-cart-counter {
            position: absolute;
            top: -2px;
            left: -2px;
            background: var(--accent-primary);
            color: white;
            font-size: 9px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #ffffff;
            border-left: 1px solid var(--border-color);
            z-index: 300;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        .close-sidebar-btn { background: transparent; border: none; font-size: 26px; color: var(--text-muted); }
        
        .cart-scroll-area { flex-grow: 1; overflow-y: auto; margin-bottom: 16px; }
        .cart-item-row { border-bottom: 1px solid var(--border-color); padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .remove-item-btn { background: transparent; border: none; color: #dc2626; font-size: 11px; font-weight: 700; margin-top: 4px; display: block; }
        
        .checkout-inputs { background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .checkout-inputs input { width: 100%; padding: 8px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 10px; outline: none; }
        
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        
        .admin-box { background: #ffffff; border: 2px solid var(--accent-primary); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        .admin-grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
        .admin-grid-inputs input, .admin-grid-inputs select { border: 1px solid #cbd5e1; padding: 9px; font-size: 12px; border-radius: 6px; outline: none; }
    </style>
</head>
<body>

    <!-- Preloader Screen -->
    <div id="app-preloader">
        <div class="spinner-container">
            <div class="glow-ring"></div>
            <div class="loading-text">LOADING</div>
        </div>
    </div>

    <!-- Main Store Header -->
    <header>
        <h1 onclick="showHome()">ARISA <span>COLLECTION</span></h1>
        <nav>
            <a onclick="showHome()" id="nav-home" class="active">HOME</a>
            <a onclick="showAbout()" id="nav-about">ABOUT</a>
            <a onclick="showPolicy()" id="nav-policy">POLICY</a>
            <a onclick="toggleCart()">CART (<span id="cart-counter">0</span>)</a>
        </nav>
    </header>

    <!-- Navigation Section Bar -->
    <div class="section-bar" id="category-section-bar">
        <button class="sec-btn active" id="sec-perfume" onclick="switchSection('perfume')">Perfumes & Body Care</button>
        <button class="sec-btn" id="sec-clothing" onclick="switchSection('clothing')">Clothing & Apparel</button>
    </div>

    <div class="container">
        <div id="home-content">
            
            <!-- Live Free Interactive Control Console (Admin Panel) -->
            <div id="admin-panel" class="admin-box" style="display:none;">
                <h2 style="font-size: 12px; margin-bottom: 12px; text-transform: uppercase; color:var(--accent-primary); font-weight:800;">ARISA LIVE STORAGE MANAGER (FREE)</h2>
                <div class="admin-grid-inputs">
                    <input type="text" id="admin-p-name" placeholder="Product Name">
                    <input type="number" id="admin-p-price" placeholder="Price (NLE)">
                    <input type="text" id="admin-p-img-link" placeholder="Paste Image URL Link Here">
                    <input type="number" id="admin-p-discount-percentage" placeholder="Discount % (Optional)">
                    <select id="admin-p-status">
                        <option value="available">Available</option>
                        <option value="sold-out">Sold Out</option>
                    </select>
                    <select id="admin-p-arrival">
                        <option value="no">Regular Stock</option>
                        <option value="yes">New Arrival</option>
                    </select>
                    <select id="admin-p-category">
                        <option value="perfume">Perfumes & Body Care</option>
                        <option value="clothing">Clothing & Apparel</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px; margin-top:12px;">
                    <button class="btn" id="admin-save-btn" style="background:var(--text-dark); padding:12px;" onclick="adminUploadFreeLink()">PUBLISH LIVE TO STORE</button>
                    <button class="btn" style="background:#e2e8f0; color:var(--text-dark); padding:12px; max-width:120px;" onclick="logoutAdmin()">EXIT</button>
                </div>
            </div>

            <!-- Showcase Catalogue Display Grid -->
            <div class="product-grid" id="products-catalogue-grid"></div>
            
            <!-- Hidden admin security login door wrapper -->
            <div style="text-align:center; margin-top:60px; padding: 20px; opacity: 0.05;" onclick="handleSecretAdminTap()">
                <span style="font-size: 10px; cursor: pointer;">[ ADMIN PORTAL ]</span>
            </div>
        </div>

        <!-- Info Secondary Subpages Frame -->
        <div id="page-content" style="display:none; background:var(--card-bg); border:1px solid var(--border-color); padding:24px; border-radius:8px;">
            <div id="page-inner-content"></div>
        </div>
    </div>

    <!-- Sticky Cart Drawer Shortcut Badge -->
    <button id="floating-cart-btn" onclick="toggleCart()">🛍️ <span id="floating-cart-counter">0</span></button>

    <!-- Shopping Bag Sidebar Panel Overlay -->
    <div class="sidebar" id="cart-sidebar">
        <div class="sidebar-header">
            <h2 style="font-size:16px; font-weight:800;">SHOPPING BAG</h2>
            <button class="close-sidebar-btn" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-scroll-area"><div id="cart-items-list"></div></div>
        <div class="checkout-inputs">
            <input type="text" id="cust-name" placeholder="Your Name">
            <input type="tel" id="cust-phone" placeholder="WhatsApp Number">
        </div>
        <div style="margin-bottom: 16px;">
            <div class="summary-row"><span>Total Due:</span><strong><span id="cart-grand-total">0.00</span> NLE</strong></div>
        </div>
        <button class="btn" style="padding:12px;" onclick="checkoutWhatsApp()">ORDER ON WHATSAPP</button>
    </div>

    <script>
        const myWhatsAppNumber = "23274170733"; 

        // 🔴 PASTE YOUR ACTUAL CONFIG VALUES FROM PROJECT SETTINGS HERE:
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "arisa-perfume-store.firebaseapp.com",
            databaseURL: "https://arisa-perfume-store-default-rtdb.firebaseio.com/",
            projectId: "arisa-perfume-store",
            storageBucket: "arisa-perfume-store.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize App Network Services
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const catalogRef = database.ref('perfumes');

        let itemsCollection = []; 
        let cart = [];
        let currentSection = 'perfume'; 
        let secretClickCount = 0;

        // Auto sync database updates live straight to interface grids
        catalogRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                itemsCollection = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            } else {
                itemsCollection = [];
            }
            renderProducts();
            
            const preloader = document.getElementById('app-preloader');
            if(preloader) {
                preloader.style.opacity = '0';
                setTimeout(() => preloader.style.display = 'none', 400);
            }
        });

        function switchSection(sectionName) {
            currentSection = sectionName;
            document.getElementById('sec-perfume').classList.remove('active');
            document.getElementById('sec-clothing').classList.remove('active');
            document.getElementById('sec-' + sectionName).classList.add('active');
            renderProducts();
        }

        function handleSecretAdminTap() {
            secretClickCount++;
            if (secretClickCount >= 3) {
                secretClickCount = 0;
                loginAdmin();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('products-catalogue-grid');
            grid.innerHTML = '';
            const isAdmin = sessionStorage.getItem('isArisaAdmin') === 'true';
            const filteredItems = itemsCollection.filter(item => item.category === currentSection);

            if (filteredItems.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; font-size:12px; color:var(--text-muted); text-align:center; padding:48px 0;">No items found in this category.</p>`;
                return;
            }

            filteredItems.forEach(p => {
                const sold = p.status === 'sold-out';
                const originalPrice = parseFloat(p.price);
                let priceHTML = `<span class="price-current">${originalPrice.toFixed(2)} NLE</span>`;

                if (p.discountPercentage && parseFloat(p.discountPercentage) > 0) {
                    let pct = parseFloat(p.discountPercentage);
                    let finalPrice = originalPrice - (originalPrice * (pct / 100));
                    priceHTML = `<span class="price-current">${finalPrice.toFixed(2)} NLE</span> <span class="price-old">${originalPrice.toFixed(2)} NLE</span>`;
                }

                grid.innerHTML += `
                    <div class="product-card" onclick="${sold ? '' : `directAddToCart('${p.id}')`}">
                        <span class="status-badge ${p.status}">${p.status}</span>
                        ${p.isNewArrival === 'yes' ? '<span class="new-badge">NEW</span>' : ''}
                        <div class="product-image"><img src="${p.image || 'https://via.placeholder.com/150'}"></div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="price-container">${priceHTML}</div>
                            <button class="btn" ${sold ? 'disabled' : ''}>${sold ? 'OUT OF STOCK' : 'ADD TO CART'}</button>
                        </div>
                        ${isAdmin ? `<div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:8px; z-index:10;">
                            <button class="btn" style="background:#dc2626; font-size:9px;" onclick="event.stopPropagation(); deleteProductLive('${p.id}')">Delete</button>
                            <button class="btn" style="background:#2563eb; font-size:9px;" onclick="event.stopPropagation(); toggleStatusLive('${p.id}')">Toggle</button>
                        </div>` : ''}
                    </div>`;
            });
        }

        window.directAddToCart = (productId) => {
            const item = itemsCollection.find(p => p.id === productId);
            if (!item || item.status === 'sold-out') return;
            cart.push({ ...item, cartId: Date.now() }); 
            updateCartUI();
            document.getElementById('floating-cart-btn').style.display = 'block';
        };

        window.removeCartItem = (cartId) => {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartUI();
            if (cart.length === 0) document.getElementById('floating-cart-btn').style.display = 'none';
        };

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            document.getElementById('floating-cart-counter').innerText = cart.length;
            let total = 0;
            const list = document.getElementById('cart-items-list');
            list.innerHTML = cart.map(i => {
                const price = parseFloat(i.price);
                total += price;
                return `<div class="cart-item-row"><div><h4>${i.name}</h4><button class="remove-item-btn" onclick="removeCartItem(${i.cartId})">Remove</button></div><span>${price.toFixed(2)} NLE</span></div>`;
            }).join('');
            document.getElementById('cart-grand-total').innerText = total.toFixed(2);
        }

        // Saves text and image link instantly to free Realtime Database
        window.adminUploadFreeLink = function() {
            const name = document.getElementById('admin-p-name').value.trim();
            const price = document.getElementById('admin-p-price').value.trim();
            const imgLink = document.getElementById('admin-p-img-link').value.trim();
            const discountPct = document.getElementById('admin-p-discount-percentage').value.trim() || "0";
            const status = document.getElementById('admin-p-status').value;
            const isArrival = document.getElementById('admin-p-arrival').value;
            const category = document.getElementById('admin-p-category').value;
            
            if (!name || !price || !imgLink) { 
                alert("Please complete the Name, Price, and Image Link fields."); 
                return; 
            }

            const newProductRef = catalogRef.push(); 
            newProductRef.set({
                name: name,
                price: price,
                discountPercentage: discountPct,
                status: status,
                isNewArrival: isArrival,
                category: category,
                image: imgLink
            }, (error) => {
                if (!error) {
                    document.getElementById('admin-p-name').value = '';
                    document.getElementById('admin-p-price').value = '';
                    document.getElementById('admin-p-img-link').value = '';
                    document.getElementById('admin-p-discount-percentage').value = '';
                    alert("Product published live successfully!");
                } else {
                    alert("Database Error: " + error.message);
                }
            });
        };

        window.deleteProductLive = function(id) {
            if(confirm("Permanently wipe item from live catalogs?")) {
                database.ref('perfumes/' + id).remove();
            }
        };

        window.toggleStatusLive = function(id) {
            const item = itemsCollection.find(p => p.id === id);
            if(item) {
                const nextStatus = item.status === 'available' ? 'sold-out' : 'available';
                database.ref('perfumes/' + id).update({ status: nextStatus });
            }
        };

        window.toggleCart = () => {
            const el = document.getElementById('cart-sidebar');
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
        };

        window.loginAdmin = () => {
            if (prompt("Password:") === "AMIRA") {
                sessionStorage.setItem('isArisaAdmin', 'true');
                document.getElementById('admin-panel').style.display = 'block';
                renderProducts();
            }
        };

        window.logoutAdmin = () => {
            sessionStorage.removeItem('isArisaAdmin');
            document.getElementById('admin-panel').style.display = 'none';
            renderProducts();
        };

        window.checkoutWhatsApp = () => {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const grandTotal = document.getElementById('cart-grand-total').innerText;
            if(!name || !phone || cart.length === 0) return;

            let msg = `*ARISA COLLECTION ORDER*\nCustomer: ${name}\nPhone: ${phone}\nTotal: ${grandTotal} NLE\n\n*Ordered Items:*\n`;
            cart.forEach(i => { msg += `• ${i.name}\n`; });

            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(msg)}`, '_blank');
            cart = []; updateCartUI(); toggleCart();
        };

        window.showHome = () => {
            document.getElementById('home-content').style.display = 'block';
            document.getElementById('page-content').style.display = 'none';
        };
        
        window.showAbout = () => {
            document.getElementById('home-content').style.display = 'none';
            document.getElementById('page-content').style.display = 'block';
            document.getElementById('page-inner-content').innerHTML = `<h2>About ARISA COLLECTION</h2><p>Premium fragrance showroom and boutique collections.</p>`;
        };

        window.showPolicy = () => {
            document.getElementById('home-content').style.display = 'none';
            document.getElementById('page-content').style.display = 'block';
            document.getElementById('page-inner-content').innerHTML = `<h2>Store Policies</h2><p>Deliveries dispatch within Freetown following direct WhatsApp confirmation.</p>`;
        };
    </script>
</body>
</html>
