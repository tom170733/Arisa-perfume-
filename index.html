<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISA PERFUME STORE | Luxury Scents</title>
    <style>
        /* LUXURY BLACK AND GOLD THEME */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        body { background-color: #000000; color: #ffffff; line-height: 1.6; overflow-x: hidden; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #1a1a1a; border-bottom: 2px solid #d4af37; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #d4af37; cursor: pointer; }
        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a { text-decoration: none; color: #ffffff; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; cursor: pointer; }
        .nav-links a:hover { color: #d4af37; }

        /* Search Section */
        .search-container { text-align: center; padding: 50px 5%; background: #0a0a0a; border-top: 1px solid #1a1a1a; margin-top: 40px; }
        .search-label { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; color: #d4af37; }
        .search-input { width: 100%; max-width: 500px; padding: 12px 20px; border: 1.5px solid #d4af37; background: #111; color: white; border-radius: 25px; outline: none; font-size: 14px; font-style: italic; text-align: center; }

        /* Sections Visibility */
        #about-page, #policy-page { display: none; padding: 40px 10%; min-height: 70vh; background: #000; }
        .info-box { border: 1px solid #d4af37; padding: 20px; margin-bottom: 20px; text-align: center; background: #111; font-size: 14px; color: #eee; }

        /* Hero & Shop */
        .hero { height: 50vh; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&q=80&w=1500') no-repeat center center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; border-bottom: 5px solid #d4af37; padding: 20px; }
        .hero h2 { font-size: 28px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; color: #d4af37; }
        .hero p { font-style: italic; font-size: 14px; margin-bottom: 25px; color: #fff; }

        .container { padding: 40px 5%; background: #000; }
        .section-title { text-align: center; margin-bottom: 30px; font-size: 20px; text-transform: uppercase; letter-spacing: 3px; color: #d4af37; position: relative; }
        .section-title::after { content: ''; display: block; width: 40px; height: 2px; background: #d4af37; margin: 10px auto; }

        /* Products Grid */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .product-card { background: #111; padding: 0 0 15px 0; text-align: center; border: 1px solid #1a1a1a; transition: 0.4s; position: relative; }
        .product-image { width: 100%; height: 180px; background-color: #050505; margin-bottom: 10px; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: contain; } /* Contain for perfume bottle clarity */
        
        .product-card h3 { font-size: 14px; padding: 0 5px; color: #fff; }
        .status-badge { position: absolute; top: 10px; right: 10px; padding: 3px 8px; font-size: 8px; font-weight: bold; text-transform: uppercase; z-index: 5; }
        .available { background-color: #d4af37; color: black; }
        .sold-out { background-color: #333; color: white; }
        .price { color: #d4af37; font-weight: bold; margin-bottom: 10px; font-size: 13px; display: block; }
        
        .btn { padding: 10px; background: #d4af37; color: black; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; font-size: 10px; font-weight: bold; border: none; cursor: pointer; width: 90%; transition: 0.3s; }
        .btn:hover { background: #fff; color: #000; }

        /* Cart Overlay */
        .cart-overlay { position: fixed; top: 0; right: 0; width: 100%; max-width: 350px; height: 100%; background: #111; color: white; z-index: 2000; box-shadow: -5px 0 15px rgba(0,0,0,0.5); padding: 20px; display: none; border-left: 4px solid #d4af37; overflow-y: auto; }
        .close-cart { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; color: #d4af37; }
        .cart-input { width: 100%; padding: 8px; border: 1px solid #d4af37; background: #000; color: white; margin-bottom: 12px; outline: none; font-size: 13px; }

        #admin-section { display: none; background: #0a0a0a; padding: 30px 5%; border-top: 2px solid #d4af37; }
        footer { background: #000; color: #888; text-align: center; padding: 40px 5%; border-top: 2px solid #1a1a1a; font-size: 12px; }

        @media (min-width: 768px) {
            .product-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
            .product-image { height: 280px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showHome()">ARISA</div>
        <ul class="nav-links">
            <li><a onclick="showHome()">Home</a></li>
            <li><a onclick="showAbout()">About</a></li>
            <li><a onclick="showPolicy()">Policy</a></li>
        </ul>
        <div onclick="toggleCart()" style="cursor:pointer; font-weight: bold; font-size: 13px; color: #d4af37;">
            BAG <span id="cart-counter" style="background:#d4af37; color:black; border-radius:50%; padding:1px 6px; font-size:10px;">0</span>
        </div>
    </nav>

    <div id="cart-sidebar" class="cart-overlay">
        <div class="close-cart" onclick="toggleCart()">&times;</div>
        <h3 style="text-transform: uppercase; margin-bottom: 15px; font-size: 18px; color: #d4af37;">Your Order</h3>
        <div id="cart-items-list"></div>
        
        <div style="font-size: 13px; margin-top: 10px; border-top: 1px solid #222; padding-top: 10px;">
            <div style="display: flex; justify-content: space-between;">
                <span>Subtotal:</span>
                <span><span id="cart-subtotal">0</span> NLE</span>
            </div>
            <div id="discount-row" style="display: none; justify-content: space-between; color: #d4af37; font-weight: bold; margin-top: 5px;">
                <span id="discount-text">Multi-buy Discount:</span>
                <span>-<span id="cart-discount">0</span> NLE</span>
            </div>
            <div style="font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; margin: 15px 0; border-top: 1px solid #d4af37; padding-top: 10px;">
                <span>Total:</span>
                <span style="color: #d4af37;"><span id="cart-grand-total">0</span> NLE</span>
            </div>
        </div>

        <div class="cart-form">
            <label style="font-size: 10px; color: #888;">FULL NAME</label>
            <input type="text" id="cust-name" class="cart-input" placeholder="Enter your name">
            <label style="font-size: 10px; color: #888;">DELIVERY ADDRESS</label>
            <input type="text" id="cust-address" class="cart-input" placeholder="Address in Freetown">
        </div>
        <button class="btn" style="background: #25D366; color: white; width: 100%; margin-bottom: 10px;" onclick="checkoutWhatsApp()">ORDER VIA WHATSAPP</button>
        <button class="btn" style="background: #222; color: #fff; width: 100%;" onclick="toggleCart()">CONTINUE SHOPPING</button>
    </div>

    <div id="home-content">
        <section class="hero">
            <h2>Exquisite
