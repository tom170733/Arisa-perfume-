<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISA COLLECTION | LIVE PREMIUM SHOWROOM</title>
    <!-- Utilities for Professional PDF / Invoice Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.bundle.min.js/5.0.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-pink: #ff6b8b;
            --accent-blue: #1e3a8a;
            --accent-blue-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.03);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 80px;
        }
        header {
            background: #ffffff;
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        header h1 {
            color: var(--text-dark);
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 16px;
        }
        header h1 span { color: var(--accent-pink); font-weight: 300; }
        nav { display: flex; justify-content: center; gap: 36px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            position: relative;
            padding-bottom: 6px;
        }
        nav a.active { color: var(--accent-blue); }
        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15%;
            width: 70%;
            height: 2px;
            background: var(--accent-blue);
        }
        .section-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }
        .sec-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 24px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
        }
        .sec-btn.active {
            background: var(--text-dark);
            color: #ffffff;
            border-color: var(--text-dark);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }
        .product-image {
            width: 100%;
            height: 240px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .status-badge {
            position: absolute;
            top: 24px;
            left: 24px;
            font-size: 9px;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .status-badge.available { background: #e2f8f0; color: #065f46; }
        .status-badge.sold-out { background: #fee2e2; color: #991b1b; }
        .new-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 9px;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 700;
            background: var(--accent-pink);
            color: #ffffff;
        }
        .product-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .price-container { margin-top: auto; padding-top: 8px; display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
        .price-current { font-weight: 800; font-size: 16px; }
        .price-old { text-decoration: line-through; color: var(--text-muted); font-size: 12px; }
        .discount-tag { color: var(--accent-pink); font-size: 11px; font-weight: 700; margin-left: auto; }
        .btn {
            background: var(--accent-blue);
            border: none;
            color: #ffffff;
            width: 100%;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        
        /* Sync Loading Overlay */
        #sync-loader {
            background: var(--accent-blue-light);
            color: var(--accent-blue);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 24px;
            border: 1px solid #cbd5e1;
        }

        #floating-cart-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--text-dark);
            color: #ffffff;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: none;
        }
        #floating-cart-counter {
            position: absolute;
            top: -2px;
            left: -2px;
            background: var(--accent-pink);
            color: white;
            font-size: 10px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #ffffff;
            border-left: 1px solid var(--border-color);
            z-index: 300;
            display: none;
            flex-direction: column;
            padding: 24px;
        }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px; }
        .close-sidebar-btn { background: transparent; border: none; font-size: 28px; cursor: pointer; color: var(--text-muted); }
        .cart-scroll-area { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
        .checkout-inputs { background: #f8fafc; padding: 16px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .checkout-inputs label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 6px; }
        .checkout-inputs input, .checkout-inputs select, .checkout-inputs textarea { width: 100%; padding: 10px 12px; font-size: 13px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 14px; outline: none; }
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
        .admin-box { background: #ffffff; border: 1px solid var(--text-dark); border-radius: 12px; padding: 24px; margin-bottom: 36px; }
        .admin-box h2 { font-size: 14px; margin-bottom: 16px; font-weight: 800; text-transform: uppercase; border-bottom: 2px solid var(--text-dark); padding-bottom: 8px; }
        .admin-grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .admin-grid-inputs input, .admin-grid-inputs select { border: 1px solid #cbd5e1; padding: 11px; font-size: 13px; border-radius: 6px; outline: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #ffffff; border-radius: 12px; padding: 24px; width: 100%; max-width: 380px; }
        .variant-pill-box { display: flex; gap: 10px; margin: 16px 0 24px 0; }
        .variant-pill { flex: 1; text-align: center; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .variant-pill.selected { border-color: var(--accent-blue); background: var(--accent-blue-light); color: var(--accent-blue); }
    </style>
</head>
<body>

    <header>
        <h1 onclick="showHome()">ARISA <span>COLLECTION</span></h1>
        <nav>
            <a onclick="showHome()" id="nav-home" class="active">HOME</a>
            <a onclick="showAbout()" id="nav-about">ABOUT</a>
            <a onclick="showPolicy()" id="nav-policy">POLICY</a>
            <a onclick="toggleCart()">CART (<span id="cart-counter">0</span>)</a>
        </nav>
    </header>

    <div class="section-bar" id="category-section-bar">
        <button class="sec-btn active" id="sec-perfume" onclick="switchSection('perfume')">Perfumes & Body Care</button>
        <button class="sec-btn" id="sec-clothing" onclick="switchSection('clothing')">Clothing & Apparel</button>
    </div>

    <div class="container">
        <!-- Visual loading state checker for users -->
        <div id="sync-loader">🔄 Synchronizing Live Showroom Catalogue...</div>

        <div id="home-content">
            
            <!-- Live Cloud Admin Panel Interface -->
            <div id="admin-panel" class="admin-box" style="display:none;">
                <h2>LIVE INVENTORY MANAGER (CLOUD SYNC ACTIVE)</h2>
                <div class="admin-grid-inputs">
                    <input type="text" id="admin-p-name" placeholder="Product Name">
                    <input type="number" id="admin-p-price" placeholder="Base Price (NLE)">
                    <input type="number" id="admin-p-discount-percentage" placeholder="Discount % (Optional)">
                    <select id="admin-p-status">
                        <option value="available">Available Status</option>
                        <option value="sold-out">Sold Out Status</option>
                    </select>
                    <select id="admin-p-arrival">
                        <option value="no">Regular Stock</option>
                        <option value="yes">New Arrival Label</option>
                    </select>
                    <select id="admin-p-category">
                        <option value="perfume">Perfumes & Body Care</option>
                        <option value="clothing">Clothing & Apparel</option>
                    </select>
                </div>
                <div style="margin-bottom:20px; background:#f8fafc; padding:12px; border-radius:6px; border:1px dashed #cbd5e1;">
                    <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:6px; font-weight:700; text-transform:uppercase;">Snap or Upload Product Photo:</label>
                    <input type="file" id="admin-p-file" accept="image/*" style="font-size:12px;">
                </div>
                <div style="display:flex; gap:12px;">
                    <button class="btn" id="admin-save-btn" style="background:var(--text-dark); padding:14px;" onclick="adminUploadLive()">PUBLISH LIVE FOR CUSTOMERS</button>
                    <button class="btn" style="background:#e2e8f0; color:var(--text-dark); padding:14px; max-width:140px;" onclick="logoutAdmin()">EXIT SESSION</button>
                </div>
            </div>

            <div class="product-grid" id="products-catalogue-grid"></div>
            
            <!-- Triple tap target zone at bottom -->
            <div style="text-align:center; margin-top:80px; padding: 20px; opacity: 0.15;" onclick="handleSecretAdminTap()">
                <span style="font-size: 10px; color: var(--text-muted); cursor: pointer;">[ ARISA LIVE BROADCAST CONTROL ]</span>
            </div>
        </div>

        <div id="page-content" style="display:none; background:var(--card-bg); border:1px solid var(--border-color); padding:32px; border-radius:12px; margin-top:10px; line-height:1.7;">
            <div id="page-inner-content"></div>
            <button class="btn" style="margin-top:24px; max-width:160px; background:var(--text-dark);" onclick="showHome()">Return Home</button>
        </div>
    </div>

    <button id="floating-cart-btn" onclick="toggleCart()">🛍️ <span id="floating-cart-counter">0</span></button>

    <div class="sidebar" id="cart-sidebar">
        <div class="sidebar-header">
            <h2>SHOPPING BAG</h2>
            <button class="close-sidebar-btn" onclick="toggleCart()">×</button>
        </div>
        
        <div class="cart-scroll-area"><div id="cart-items-list"></div></div>

        <div class="checkout-inputs">
            <label>Customer Name</label>
            <input type="text" id="cust-name" placeholder="Enter recipient name">
            <label>WhatsApp Number</label>
            <input type="tel" id="cust-phone" placeholder="e.g. +23277000000">
            <label>Fulfillment Setup</label>
            <select id="order-method" onchange="handleOrderMethodChange()">
                <option value="Delivery">Courier Delivery</option>
                <option value="Pick Up">Showroom Pick Up</option>
            </select>
            <div id="address-input-wrapper">
                <label>Pinpoint Address</label>
                <textarea id="cust-address" rows="2" placeholder="Street layout details..."></textarea>
            </div>
            <label>Payment Mode</label>
            <select id="payment-method">
                <option value="Orange Money">Orange Money</option>
                <option value="Afrimoney">Afrimoney</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
            </select>
        </div>

        <div style="border-top:1px solid var(--border-color); padding-top:16px; margin-bottom:20px;">
            <div class="summary-row">
                <span style="color:var(--text-muted)">Subtotal:</span>
                <span style="font-weight:600;"><span id="cart-subtotal">0.00</span> NLE</span>
            </div>
            <div class="summary-row" style="font-size:16px; font-weight:800; border-top:1px solid var(--border-color); margin-top:10px; padding-top:10px;">
                <span>Total Due:</span>
                <span><span id="cart-grand-total">0.00</span> NLE</span>
            </div>
        </div>
        <button class="btn" style="padding:14px;" onclick="checkoutWhatsApp()">COMPLETE & SEND WHATSAPP MESSAGE</button>
    </div>

    <!-- Variant Choice Modal -->
    <div class="modal-overlay" id="variant-modal" style="display:none;">
        <div class="modal-card">
            <h3 style="font-size:15px; font-weight:800; margin-bottom:6px;" id="v-modal-title">SELECT OPTION</h3>
            <div class="variant-pill-box">
                <div class="variant-pill selected" id="pill-pink" onclick="selectVariantColor('Pink')">Pink</div>
                <div class="variant-pill" id="pill-blue" onclick="selectVariantColor('Blue')">Blue</div>
                <div class="variant-pill" id="pill-white" onclick="selectVariantColor('White')">White</div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" onclick="confirmVariantSelection()">ADD TO BAG</button>
                <button class="btn" style="background:#e2e8f0; color:var(--text-dark); max-width:90px;" onclick="closeVariantModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        const myWhatsAppNumber = "23274646545"; 
        
        // Free Key-Value Storage Engine API Endpoint for Instant Live Syncing
        const cloudStorageUrl = "https://kvdb.io/MN74qTqWv9Z3x8w7KqL5aG/arisa_store_catalog";

        let itemsCollection = []; 
        let cart = [];
        let currentSection = 'perfume'; 
        let secretClickCount = 0;
        let activeTargetProductId = null;
        let activeSelectedColor = 'Pink';

        // Load the catalog data live from the cloud storage whenever a user visits
        async function fetchLiveCloudCatalog() {
            const loader = document.getElementById('sync-loader');
            try {
                const response = await fetch(cloudStorageUrl);
                if (response.ok) {
                    itemsCollection = await response.json();
                    loader.style.backgroundColor = "#e2f8f0";
                    loader.style.color = "#065f46";
                    loader.innerText = "✅ Live Catalog Updated!";
                    setTimeout(() => loader.style.display = 'none', 2000);
                } else {
                    // Initialize with default fallback if server bin is new
                    itemsCollection = [];
                    loader.style.display = 'none';
                }
            } catch (error) {
                console.log("Server setup initialized, loading baseline backup profile...");
                loader.innerText = "⚠️ Running Offline Backup Mode";
                itemsCollection = [
                    { id: "1", name: "Premium Oud Sample", price: "450", discountPercentage: "", status: "available", isNewArrival: "yes", category: "perfume", image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23eff6ff'/><text x='50%' y='55%' font-family='sans-serif' font-size='10' text-anchor='middle' fill='%231e3a8a'>No Photo snapped</text></svg>" }
                ];
            }
            renderProducts();
        }

        window.onload = function() {
            fetchLiveCloudCatalog();
            if (sessionStorage.getItem('isArisaAdmin') === 'true') {
                document.getElementById('admin-panel').style.display = 'block';
            }
        };

        async function pushLiveCloudCatalog() {
            try {
                await fetch(cloudStorageUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(itemsCollection)
                });
            } catch (e) {
                alert("Cloud Sync connection timed out. Check your mobile internet status.");
            }
        }

        function switchSection(sectionName) {
            currentSection = sectionName;
            document.getElementById('sec-perfume').classList.remove('active');
            document.getElementById('sec-clothing').classList.remove('active');
            document.getElementById('sec-' + sectionName).classList.add('active');
            renderProducts();
        }

        function handleSecretAdminTap() {
            secretClickCount++;
            if (secretClickCount >= 3) {
                secretClickCount = 0;
                loginAdmin();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('products-catalogue-grid');
            grid.innerHTML = '';
            const isAdmin = sessionStorage.getItem('isArisaAdmin') === 'true';
            const filteredItems = itemsCollection.filter(item => item.category === currentSection);

            if (filteredItems.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; font-size:13px; color:var(--text-muted); text-align:center; padding:64px 0;">No items active under this catalog profile.</p>`;
                return;
            }

            filteredItems.forEach(p => {
                const sold = p.status === 'sold-out';
                const originalPrice = parseFloat(p.price);
                let priceDisplayHTML = '';

                if (p.discountPercentage && parseFloat(p.discountPercentage) > 0) {
                    let pct = parseFloat(p.discountPercentage);
                    let finalPrice = originalPrice - (originalPrice * (pct / 100));
                    priceDisplayHTML = `
                        <div class="price-container">
                            <span class="price-current">${finalPrice.toFixed(2)} NLE</span>
                            <span class="price-old">${originalPrice.toFixed(2)} NLE</span>
                            <span class="discount-tag">${pct}% OFF</span>
                        </div>`;
                } else {
                    priceDisplayHTML = `<div class="price-container"><span class="price-current">${originalPrice.toFixed(2)} NLE</span></div>`;
                }

                grid.innerHTML += `
                    <div class="product-card" onclick="${sold ? '' : `openVariantModal('${p.id}')`}">
                        <span class="status-badge ${p.status}">${p.status}</span>
                        ${p.isNewArrival === 'yes' ? '<span class="new-badge">NEW</span>' : ''}
                        <div class="product-image"><img src="${p.image}"></div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            ${priceDisplayHTML}
                            <button class="btn" ${sold ? 'disabled' : ''}>${sold ? 'OUT OF STOCK' : 'CHOOSE VARIANT'}</button>
                        </div>
                        ${isAdmin ? `<div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:12px; border-top:1px solid #e2e8f0; padding-top:8px;">
                            <button class="btn" style="background:#dc2626; font-size:9px; padding:6px 0;" onclick="event.stopPropagation(); deleteProductLive('${p.id}')">Delete Item</button>
                            <button class="btn" style="background:#2563eb; font-size:9px; padding:6px 0;" onclick="event.stopPropagation(); toggleStatusLive('${p.id}')">Toggle Status</button>
                        </div>` : ''}
                    </div>`;
            });
        }

        // --- Core Smart Mobile Image Compression & Upload System ---
        window.adminUploadLive = function() {
            const name = document.getElementById('admin-p-name').value.trim();
            const price = document.getElementById('admin-p-price').value.trim();
            const discountPct = document.getElementById('admin-p-discount-percentage').value.trim();
            const status = document.getElementById('admin-p-status').value;
            const isArrival = document.getElementById('admin-p-arrival').value;
            const category = document.getElementById('admin-p-category').value;
            const fileInput = document.getElementById('admin-p-file');
            
            if (!name || !price) {
                alert("Please complete the Name and Price input boxes.");
                return;
            }

            const saveBtn = document.getElementById('admin-save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = "COMPRESSING IMAGE & SYNCING LIVE...";

            const finalizePush = async (imageString) => {
                const newProduct = {
                    id: Date.now().toString(),
                    name: name,
                    price: price,
                    discountPercentage: discountPct,
                    status: status,
                    isNewArrival: isArrival,
                    category: category,
                    image: imageString
                };
                
                itemsCollection.push(newProduct);
                await pushLiveCloudCatalog(); // Sync changes straight to the customers' view
                
                // Reset admin layout parameters
                document.getElementById('admin-p-name').value = '';
                document.getElementById('admin-p-price').value = '';
                document.getElementById('admin-p-discount-percentage').value = '';
                fileInput.value = '';
                
                saveBtn.disabled = false;
                saveBtn.innerText = "PUBLISH LIVE FOR CUSTOMERS";
                renderProducts();
                alert("Success! Product is now live. Customers will see it instantly when they open the site.");
            };

            if (fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        // Scale picture resolution slightly down so it broadcasts instantly over mobile data packages
                        const MAX_SIZE = 350; 
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Convert downscaled graphic into high efficiency string file layout 
                        finalizePush(canvas.toDataURL('image/jpeg', 0.60));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                finalizePush("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23eff6ff'/><text x='50%' y='55%' font-family='sans-serif' font-size='10' text-anchor='middle' fill='%231e3a8a'>No Image</text></svg>");
            }
        };

        window.deleteProductLive = async function(id) {
            if(confirm("Permanently delete this item from the live store catalog?")) {
                itemsCollection = itemsCollection.filter(p => p.id !== id);
                await pushLiveCloudCatalog();
                renderProducts();
            }
        };

        window.toggleStatusLive = async function(id) {
            itemsCollection = itemsCollection.map(p => {
                if(p.id === id) {
                    p.status = p.status === 'available' ? 'sold-out' : 'available';
                }
                return p;
            });
            await pushLiveCloudCatalog();
            renderProducts();
        };

        window.openVariantModal = (productId) => {
            activeTargetProductId = productId;
            const item = itemsCollection.find(p => p.id === productId);
            document.getElementById('v-modal-title').innerText = item.name;
            document.getElementById('variant-modal').style.display = 'flex';
        };

        window.closeVariantModal = () => { document.getElementById('variant-modal').style.display = 'none'; };

        window.selectVariantColor = (colorName) => {
            activeSelectedColor = colorName;
            document.getElementById('pill-pink').classList.remove('selected');
            document.getElementById('pill-blue').classList.remove('selected');
            document.getElementById('pill-white').classList.remove('selected');
            document.getElementById('pill-' + colorName.toLowerCase()).classList.add('selected');
        };

        window.confirmVariantSelection = () => {
            const item = itemsCollection.find(p => p.id === activeTargetProductId);
            cart.push({ ...item, cartId: Date.now(), chosenColor: activeSelectedColor }); 
            updateCartUI();
            closeVariantModal();
            document.getElementById('floating-cart-btn').style.display = 'block';
        };

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            document.getElementById('floating-cart-counter').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            let subtotal = 0;

            list.innerHTML = cart.map(i => {
                const base = parseFloat(i.price);
                const final = i.discountPercentage ? (base - (base * (parseFloat(i.discountPercentage)/100))) : base;
                subtotal += final;
                return `
                    <div style="border-bottom:1px solid var(--border-color); padding:14px 0; display:flex; justify-content:space-between;">
                        <div>
                            <h4 style="font-size:13px; font-weight:700;">${i.name}</h4>
                            <span style="font-size:11px; color:var(--accent-blue);">Option: ${i.chosenColor}</span>
                        </div>
                        <span style="font-size:13px; font-weight:800;">${final.toFixed(2)} NLE</span>
                    </div>`;
            }).join('');

            document.getElementById('cart-subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('cart-grand-total').innerText = subtotal.toFixed(2);
        }

        window.toggleCart = () => {
            const el = document.getElementById('cart-sidebar');
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
        };

        window.handleOrderMethodChange = () => {
            document.getElementById('address-input-wrapper').style.display = 
                (document.getElementById('order-method').value === 'Pick Up') ? 'none' : 'block';
        };

        window.loginAdmin = () => {
            if (prompt("Enter Control Verification Password:") === "AMIRA") {
                sessionStorage.setItem('isArisaAdmin', 'true');
                document.getElementById('admin-panel').style.display = 'block';
                renderProducts();
            }
        };

        window.logoutAdmin = () => {
            sessionStorage.removeItem('isArisaAdmin');
            document.getElementById('admin-panel').style.display = 'none';
            renderProducts();
        };

        window.checkoutWhatsApp = () => {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const grandTotal = document.getElementById('cart-grand-total').innerText;
            if(!name || !phone || cart.length === 0) return;

            let msg = `*ARISA COLLECTION ORDER*\nCustomer: ${name}\nPhone: ${phone}\nTotal: ${grandTotal} NLE\n\n*Items:*\n`;
            cart.forEach(i => { msg += `• ${i.name} (${i.chosenColor})\n`; });

            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(msg)}`, '_blank');
            cart = [];
            updateCartUI();
            toggleCart();
            document.getElementById('floating-cart-btn').style.display = 'none';
        };

        window.showHome = () => {
            document.getElementById('home-content').style.display = 'block';
            document.getElementById('page-content').style.display = 'none';
            document.getElementById('category-section-bar').style.display = 'flex';
        };
        window.showAbout = () => {
            document.getElementById('home-content').style.display = 'none';
            document.getElementById('category-section-bar').style.display = 'none';
            document.getElementById('page-content').style.display = 'block';
            document.getElementById('page-inner-content').innerHTML = `<h2>ABOUT ARISA</h2><p>Premium live catalog tailored for direct smartphone administration.</p>`;
        };
        window.showPolicy = () => {
            document.getElementById('home-content').style.display = 'none';
            document.getElementById('category-section-bar').style.display = 'none';
            document.getElementById('page-content').style.display = 'block';
            document.getElementById('page-inner-content').innerHTML = `<h2>STORE POLICY</h2><p>All items checked through automated checkout and finalized instantly via WhatsApp delivery lines.</p>`;
        };
    </script>
</body>
</html>
