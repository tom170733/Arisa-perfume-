<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISA PERFUME STORE | Luxury Scents</title>
    <style>
        /* LUXURY BLACK AND GOLD THEME */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        body { background-color: #000000; color: #ffffff; line-height: 1.6; overflow-x: hidden; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #111; border-bottom: 2px solid #d4af37; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #d4af37; cursor: pointer; }
        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a { text-decoration: none; color: #ffffff; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }

        /* Admin Panel Styling */
        #admin-panel { display: none; background: #111; padding: 30px 5%; border-bottom: 2px solid #d4af37; text-align: center; }
        .admin-input { padding: 10px; margin: 5px; border: 1px solid #d4af37; background: #000; color: #fff; width: 100%; max-width: 200px; }

        /* Hero & Shop */
        .hero { height: 50vh; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&q=80&w=1500') no-repeat center center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 5px solid #d4af37; }
        .hero h2 { font-size: 28px; letter-spacing: 3px; text-transform: uppercase; color: #d4af37; }

        .container { padding: 40px 5%; background: #000; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .product-card { background: #111; padding: 15px; text-align: center; border: 1px solid #1a1a1a; position: relative; }
        .product-image { width: 100%; height: 180px; margin-bottom: 10px; }
        .product-image img { width: 100%; height: 100%; object-fit: contain; }
        
        .status-badge { position: absolute; top: 10px; right: 10px; padding: 3px 8px; font-size: 8px; font-weight: bold; text-transform: uppercase; }
        .available { background-color: #d4af37; color: black; }
        .sold-out { background-color: #333; color: white; }
        .price { color: #d4af37; font-weight: bold; display: block; margin: 10px 0; }
        
        .btn { padding: 10px; background: #d4af37; color: black; font-weight: bold; text-transform: uppercase; font-size: 10px; border: none; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { background: #fff; }

        /* Cart Sidebar */
        .cart-overlay { position: fixed; top: 0; right: 0; width: 100%; max-width: 350px; height: 100%; background: #111; z-index: 2000; padding: 20px; display: none; border-left: 4px solid #d4af37; overflow-y: auto; }
        .cart-input { width: 100%; padding: 10px; border: 1px solid #d4af37; background: #000; color: white; margin-bottom: 10px; }

        /* Suggestion Box */
        .suggestion-section { padding: 40px 5%; background: #0a0a0a; text-align: center; border-top: 1px solid #1a1a1a; }
        .suggest-input { width: 100%; max-width: 500px; height: 100px; background: #000; border: 1px solid #d4af37; color: #fff; padding: 10px; margin-bottom: 10px; }

        footer { background: #000; color: #444; text-align: center; padding: 30px; border-top: 1px solid #111; font-size: 10px; }

        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); } }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showHome()">ARISA</div>
        <ul class="nav-links">
            <li><a onclick="showHome()">Home</a></li>
            <li><a onclick="showAbout()">About</a></li>
            <li><a onclick="showPolicy()">Policy</a></li>
        </ul>
        <div onclick="toggleCart()" style="cursor:pointer; color: #d4af37; font-weight: bold;">
            BAG <span id="cart-counter" style="background:#d4af37; color:black; border-radius:50%; padding:2px 7px; font-size:11px;">0</span>
        </div>
    </nav>

    <div id="admin-panel">
        <h3 style="color:#d4af37; margin-bottom:15px;">STAFF CONTROL PANEL</h3>
        <input type="text" id="admin-p-name" class="admin-input" placeholder="Product Name">
        <input type="number" id="admin-p-price" class="admin-input" placeholder="Price (NLE)">
        <select id="admin-p-status" class="admin-input">
            <option value="available">Available</option>
            <option value="sold-out">Sold Out</option>
        </select>
        <input type="file" id="admin-p-file" class="admin-input" accept="image/*">
        <br>
        <button class="btn" style="width: 200px; margin-top: 10px;" onclick="adminUpload()">ADD PRODUCT</button>
        <button class="btn" style="width: 200px; background:#333; color:white;" onclick="logoutAdmin()">LOGOUT</button>
    </div>

    <div id="cart-sidebar" class="cart-overlay">
        <h3 style="color:#d4af37; margin-bottom:20px;">YOUR BAG</h3>
        <div id="cart-items-list"></div>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <div style="font-size:14px;">
            <p>Subtotal: <span id="cart-subtotal">0</span> NLE</p>
            <p id="discount-row" style="color:#d4af37; display:none;">Discount: -<span id="cart-discount">0</span> NLE</p>
            <p style="font-size:18px; font-weight:bold; margin-top:10px;">Total: <span id="cart-grand-total">0</span> NLE</p>
        </div>
        <input type="text" id="cust-name" class="cart-input" placeholder="Full Name" style="margin-top:20px;">
        <input type="text" id="cust-address" class="cart-input" placeholder="Delivery Address">
        <button class="btn" style="background:#25D366; color:white;" onclick="checkoutWhatsApp()">ORDER ON WHATSAPP</button>
        <button class="btn" style="background:#222; color:white; margin-top:10px;" onclick="toggleCart()">CLOSE</button>
    </div>

    <div id="home-content">
        <section class="hero">
            <h2>Luxury Fragrances</h2>
            <p>24/7 Delivery in Freetown</p>
        </section>
        <div class="container">
            <div class="product-grid" id="product-grid"></div>
        </div>
    </div>

    <div class="suggestion-section">
        <h3 style="color:#d4af37; margin-bottom:10px;">SUGGESTIONS</h3>
        <textarea id="user-suggestion" class="suggest-input" placeholder="What scent should we add next?"></textarea><br>
        <button class="btn" style="width: 200px;" onclick="sendSuggestion()">SEND TO STAFF</button>
    </div>

    <footer>
        <p>&copy; 2026 ARISA PERFUME STORE.</p>
        <button onclick="loginAdmin()" style="background:none; border:none; color:#111; cursor:pointer;">Staff Login</button>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD6VOairMfPk1fM9VApccmNEPAdMIb3HO4",
            authDomain: "arisa-perfume-store.firebaseapp.com",
            databaseURL: "https://arisa-perfume-store-default-rtdb.firebaseio.com",
            projectId: "arisa-perfume-store",
            storageBucket: "arisa-perfume-store.firebasestorage.app",
            messagingSenderId: "49919010733",
            appId: "1:49919010733:web:2087407e3f6bd41c1fe324"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myWhatsAppNumber = "232074170733";
        let cart = [];
        let perfumes = [];

        db.ref('perfumes').on('value', (snapshot) => {
            const data = snapshot.val();
            perfumes = [];
            if (data) Object.keys(data).forEach(key => perfumes.push({ firebaseId: key, ...data[key] }));
            renderProducts();
        });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            const isAdmin = sessionStorage.getItem('isArisaAdmin') === 'true';
            
            perfumes.forEach((p) => {
                const sold = p.status === 'sold-out';
                grid.innerHTML += `
                    <div class="product-card">
                        <span class="status-badge ${p.status}">${p.status}</span>
                        <div class="product-image"><img src="${p.image}"></div>
                        <h3>${p.name}</h3>
                        <span class="price">${p.price} NLE</span>
                        <button class="btn" onclick="${sold ? '' : `addToBag('${p.firebaseId}')`}" ${sold ? 'disabled' : ''}>
                            ${sold ? 'OUT OF STOCK' : 'ADD TO BAG'}
                        </button>
                        ${isAdmin ? `<button class="btn" style="background:#444; margin-top:5px;" onclick="toggleStatus('${p.firebaseId}','${p.status}')">Toggle Status</button>
                                     <button class="btn" style="background:red; margin-top:5px;" onclick="deleteProduct('${p.firebaseId}')">Delete</button>` : ''}
                    </div>`;
            });
        }

        // BAG & DISCOUNT LOGIC
        window.addToBag = (id) => {
            const item = perfumes.find(p => p.firebaseId === id);
            cart.push(item);
            updateCartUI();
            document.getElementById('cart-sidebar').style.display = 'block';
        };

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            let subtotal = 0;
            list.innerHTML = cart.map(i => {
                subtotal += parseFloat(i.price);
                return `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${i.name}</span><span>${i.price} NLE</span></div>`;
            }).join('');

            let discount = 0;
            if(cart.length === 2) discount = subtotal * 0.05;
            else if(cart.length >= 3) discount = subtotal * 0.10;

            document.getElementById('cart-subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('cart-discount').innerText = discount.toFixed(2);
            document.getElementById('cart-grand-total').innerText = (subtotal - discount).toFixed(2);
            document.getElementById('discount-row').style.display = discount > 0 ? 'block' : 'none';
        }

        window.toggleCart = () => {
            const c = document.getElementById('cart-sidebar');
            c.style.display = c.style.display === 'block' ? 'none' : 'block';
        };

        // ADMIN FUNCTIONS
        window.loginAdmin = () => {
            if(prompt("Staff Password:") === "@Thomas74170733") {
                sessionStorage.setItem('isArisaAdmin', 'true');
                document.getElementById('admin-panel').style.display = 'block';
                renderProducts();
            }
        };

        window.logoutAdmin = () => {
            sessionStorage.removeItem('isArisaAdmin');
            document.getElementById('admin-panel').style.display = 'none';
            renderProducts();
        };

        window.adminUpload = () => {
            const name = document.getElementById('admin-p-name').value;
            const price = document.getElementById('admin-p-price').value;
            const status = document.getElementById('admin-p-status').value;
            const file = document.getElementById('admin-p-file').files[0];
            if(name && price && file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    db.ref('perfumes').push({ name, price, status, image: e.target.result });
                    alert("Added!");
                };
                reader.readAsDataURL(file);
            }
        };

        window.toggleStatus = (id, cur) => {
            db.ref('perfumes/' + id).update({ status: cur === 'available' ? 'sold-out' : 'available' });
        };

        window.deleteProduct = (id) => { if(confirm("Delete?")) db.ref('perfumes/' + id).remove(); };

        // UTILITIES
        window.sendSuggestion = () => {
            const text = document.getElementById('user-suggestion').value;
            window.open(`https://wa.me/${myWhatsAppNumber}?text=Suggestion: ${encodeURIComponent(text)}`);
        };

        window.checkoutWhatsApp = () => {
            const name = document.getElementById('cust-name').value;
            const addr = document.getElementById('cust-address').value;
            const total = document.getElementById('cart-grand-total').innerText;
            const items = cart.map(i => i.name).join(', ');
            const msg = `Order for ${name}\nAddress: ${addr}\nItems: ${items}\nTotal: ${total} NLE`;
            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(msg)}`);
        };

        function showHome() { renderProducts(); }
    </script>
</body>
</html>
