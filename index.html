<script>
        // --- GLOBAL STATE INITIALIZATION ---
        let cart = [];
        let savedItems = [];
        // Note: 'perfumes' array should be populated dynamically via your Firebase snapshot setup below.
        let perfumes = []; 
        const myWhatsAppNumber = "23277000000"; // Replace with your exact business WhatsApp number

        // --- FIREBASE REAL-TIME DB LISTENERS ---
        db.ref('perfumes').on('value', (snapshot) => {
            const data = snapshot.val();
            perfumes = [];
            for (let key in data) {
                perfumes.push({ firebaseId: key, ...data[key] });
            }
            renderProducts();
        });

        db.ref('orders').on('value', (snapshot) => {
            const orderData = snapshot.val();
            const container = document.getElementById('admin-orders-list');
            
            if(!orderData) {
                container.innerHTML = `<p style="color:#666; font-style:italic;">No active incoming orders.</p>`;
                return;
            }
            
            let html = '';
            for(let key in orderData) {
                const ord = orderData[key];
                let lineItems = '';
                if(ord.items) {
                    ord.items.forEach(i => {
                        lineItems += `<li style="margin-left:15px; color:#aaa;">${i.name} [Color: ${i.color || 'N/A'}] - ${i.activePrice} NLE</li>`;
                    });
                }
                html += `
                    <div style="background:#111; border:1px solid #222; padding:12px; margin-bottom:12px; border-radius:4px; text-align:left;">
                        <p style="color:var(--accent-color); font-weight:bold; font-size:11px;">TIMESTAMP BLOCK: ${ord.timestamp}</p>
                        <p><strong>Customer Target:</strong> ${ord.customerName} (${ord.customerPhone})</p>
                        <p><strong>Delivery Setup:</strong> ${ord.orderMethod === 'Pick Up' ? 'Customer Pick Up' : ord.customerAddress}</p>
                        <p><strong>Logistics Mode:</strong> [${ord.paymentMethod}]</p>
                        <p style="margin-top:5px; font-weight:bold; color:var(--accent-color);">Grand Bill Total: ${ord.grandTotal} NLE</p>
                        <p style="margin-top:5px; font-size:11px; text-decoration:underline;">Ordered Items:</p>
                        <ul style="margin-top:3px; margin-bottom:10px;">${lineItems}</ul>
                        <button class="btn" style="background:red; color:white; max-width:150px; font-size:8px; padding:4px;" onclick="archiveOrder('${key}')">COMPLETE & ARCHIVE</button>
                    </div>`;
            }
            container.innerHTML = html;
        });

        db.ref('suggestions').on('value', (snapshot) => {
            const data = snapshot.val();
            const listContainer = document.getElementById('suggestion-display-list');
            if(!data) {
                listContainer.innerHTML = '<p style="color:#555; font-style:italic;">No suggestions logged yet.</p>';
                return;
            }
            let html = '';
            for(let key in data) {
                html += `<div style="background:#111; padding:6px; margin-bottom:4px; border-radius:3px; border-left:2px solid var(--accent-color); text-align:left;">• ${data[key]}</div>`;
            }
            listContainer.innerHTML = html;
        });

        // LOCK APPLICATION POPSTATE CAPABILITY TO DEFEND ACTIVE POPULATED CART BASKETS
        window.addEventListener('popstate', (event) => {
            if (cart.length > 0) {
                history.pushState(null, null, window.location.pathname);
                alert("You have items inside your active transactional checkout profile block. Use store controls to browse safely.");
            }
        });

        // SYSTEM THEME PALETTE ADJUSTMENT APPLICATION CONFIGURATION MODIFIER
        function setThemeScheme(accent, bg, card, text) {
            document.documentElement.style.setProperty('--accent-color', accent);
            document.documentElement.style.setProperty('--bg-color', bg);
            document.documentElement.style.setProperty('--card-bg', card);
            document.documentElement.style.setProperty('--text-color', text);
            renderProducts();
        }

        window.archiveOrder = (orderId) => {
            if(confirm("Mark order as completed and remove from panel?")) {
                db.ref('orders/' + orderId).remove();
            }
        };

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (!grid) return;
            grid.innerHTML = '';
            const isAdmin = sessionStorage.getItem('isArisaAdmin') === 'true';
            
            const suggestionBox = document.getElementById('user-suggestion-box');
            if (suggestionBox) {
                suggestionBox.style.display = isAdmin ? 'none' : 'block';
            }

            perfumes.forEach((p) => {
                const sold = p.status === 'sold-out';
                let originalPrice = parseFloat(p.price);
                let priceDisplayHTML = '';

                if (p.discountPercentage && parseFloat(p.discountPercentage) > 0) {
                    let pct = parseFloat(p.discountPercentage);
                    let finalPrice = originalPrice - (originalPrice * (pct / 100));
                    priceDisplayHTML = `
                        <div class="price-box">
                            <span class="old-price-strike">${originalPrice} NLE</span>
                            <span class="price">${finalPrice.toFixed(2)} NLE</span>
                            <span class="discount-badge">${pct}% OFF</span>
                        </div>
                    `;
                } else {
                    priceDisplayHTML = `
                        <div class="price-box">
                            <span class="price">${originalPrice} NLE</span>
                        </div>
                    `;
                }

                const arrivalBadgeHTML = (p.isNewArrival === 'yes') 
                    ? `<span class="status-badge" style="background:#d4af37; color:black; top: 22px; right: 5px;">NEW ARRIVAL</span>` 
                    : '';

                grid.innerHTML += `
                    <div class="product-card" onclick="${sold ? '' : `handleProductTap('${p.firebaseId}')`}">
                        <span class="status-badge ${p.status}">${p.status.replace('-', ' ')}</span>
                        ${arrivalBadgeHTML}
                        <div class="product-image"><img src="${p.image}"></div>
                        <h3 style="font-size:11px;">${p.name}</h3>
                        ${p.color ? `<span class="color-label">${p.color}</span>` : ''}
                        ${priceDisplayHTML}
                        <button class="btn" ${sold ? 'disabled' : ''}>
                            ${sold ? 'SOLD OUT' : 'BUY'}
                        </button>
                        ${isAdmin ? `<button class="btn" style="background:#444; margin-top:5px; font-size:8px;" onclick="event.stopPropagation(); toggleStatus('${p.firebaseId}','${p.status}')">Status</button>
                                     <button class="btn" style="background:red; margin-top:5px; font-size:8px;" onclick="event.stopPropagation(); deleteProduct('${p.firebaseId}')">Del</button>` : ''}
                    </div>`;
            });
        }

        let tapTimer = null;
        window.handleProductTap = (id) => {
            if (tapTimer === null) {
                tapTimer = setTimeout(() => {
                    addToCart(id);
                    tapTimer = null;
                } , 300);
            } else {
                clearTimeout(tapTimer);
                tapTimer = null;
                addToCart(id);
            }
        };

        window.addToCart = (id) => {
            const existingItem = cart.find(i => i.firebaseId === id);
            if (existingItem) {
                alert("This item is already added to your cart!");
                return;
            }
            const item = perfumes.find(p => p.firebaseId === id);
            if (!item) return;
            
            // Generates a bulletproof alphanumeric unique identification hash key token string block
            const uniqueCartId = `cart_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            cart.push({...item, cartId: uniqueCartId}); 
            history.pushState(null, null, window.location.pathname);
            updateCartUI();
            document.getElementById('floating-cart-btn').style.display = 'block';
        };

        window.removeFromCart = (cartId) => {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartUI();
            if(cart.length === 0) document.getElementById('floating-cart-btn').style.display = 'none';
        };

        window.saveForLater = (cartId) => {
            const item = cart.find(i => i.cartId === cartId);
            if (item) {
                savedItems.push(item);
                cart = cart.filter(i => i.cartId !== cartId);
                updateCartUI();
            }
        };

        window.moveToCart = (cartId) => {
            const item = savedItems.find(i => i.cartId === cartId);
            if (!item) return;
            const duplicateCheck = cart.find(i => i.firebaseId === item.firebaseId);
            if(duplicateCheck) {
                alert("This item is already in your active cart panel.");
                return;
            }
            cart.push(item);
            savedItems = savedItems.filter(i => i.cartId !== cartId);
            history.pushState(null, null, window.location.pathname);
            updateCartUI();
        };

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            document.getElementById('floating-cart-counter').innerText = cart.length;
            
            const list = document.getElementById('cart-items-list');
            const savedList = document.getElementById('saved-items-list');
            let subtotal = 0;

            list.innerHTML = cart.map(i => {
                const originalPrice = parseFloat(i.price);
                let finalActivePrice = originalPrice;
                let discountTextHTML = '';

                if (i.discountPercentage && parseFloat(i.discountPercentage) > 0) {
                    const pct = parseFloat(i.discountPercentage);
                    finalActivePrice = originalPrice - (originalPrice * (pct / 100));
                    discountTextHTML = `<span style="color:#ff4d6d; font-size:10px; display:block;">-${pct}% Applied (was ${originalPrice.toFixed(2)} NLE)</span>`;
                }

                subtotal += finalActivePrice;
                i.calculatedCartPrice = finalActivePrice; 
                
                return `
                    <div style="border-bottom:1px solid #222; padding:10px 0; display:flex; justify-content:space-between; align-items:center;">
                        <div style="text-align:left; max-width:65%;">
                            <h4 style="font-size:12px; color:var(--accent-color); font-weight:normal;">${i.name}</h4>
                            ${i.color ? `<span style="font-size:9px; color:#666;">COLOR: ${i.color}</span>` : ''}
                            ${discountTextHTML}
                        </div>
                        <div style="text-align:right;">
                            <span style="font-size:12px; font-weight:bold; display:block; margin-bottom:5px;">${finalActivePrice.toFixed(2)} NLE</span>
                            <div style="display:flex; gap:5px; justify-content:flex-end;">
                                <button class="save-btn" onclick="saveForLater(${i.cartId})">Save</button>
                                <button class="remove-btn" onclick="removeFromCart(${i.cartId})">Remove</button>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            if(savedItems.length > 0) {
                document.getElementById('saved-items-container').style.display = 'block';
                savedList.innerHTML = savedItems.map(i => `
                    <div style="border-bottom:1px dashed #222; padding:8px 0; display:flex; justify-content:space-between; align-items:center; opacity:0.6;">
                        <span style="font-size:11px; text-align:left;">${i.name}</span>
                        <button class="save-btn" style="color:#fff; border-color:#555;" onclick="moveToCart(${i.cartId})">Move to Cart</button>
                    </div>`).join('');
            } else {
                document.getElementById('saved-items-container').style.display = 'none';
            }

            // --- BATCH ITEM BULK PURCHASE DISCOUNT MATRIX LOGIC ---
            let discountPercentage = 0;
            let rewardDiscount = 0;

            if (cart.length === 2) {
                discountPercentage = 10; // 10% discount for purchasing exactly 2 items
            } else if (cart.length >= 3) {
                discountPercentage = 15; // 15% discount for purchasing 3 or more items
            }

            if (discountPercentage > 0) {
                rewardDiscount = subtotal * (discountPercentage / 100);
                document.getElementById('discount-row').style.display = 'block';
                document.getElementById('cart-discount').innerText = `${rewardDiscount.toFixed(2)} NLE (${discountPercentage}% OFF)`;
            } else {
                document.getElementById('discount-row').style.display = 'none';
            }

            let grandTotal = subtotal - rewardDiscount;
            if (grandTotal < 0) grandTotal = 0;

            document.getElementById('cart-subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('cart-grand-total').innerText = grandTotal.toFixed(2);
        }

        // CONTROL OVERLAY VIEW MOVEMENT: PREVENT SCROLLING WHILE CUSTOMER WRITES INFO
        window.toggleCart = () => {
            const el = document.getElementById('cart-sidebar');
            if (el.style.display === 'block') {
                el.style.display = 'none';
                document.body.style.overflow = 'auto'; // release viewport scrolling
                document.body.style.height = 'auto';
            } else {
                el.style.display = 'block';
                document.body.style.overflow = 'hidden'; // freeze viewport scrolling completely
                document.body.style.height = '100vh';
            }
        };

        // HANDLE DYNAMIC HIDING OF ADDRESS BOX FOR PICK UP METHOD
        window.handleOrderMethodChange = () => {
            const method = document.getElementById('order-method').value;
            const addressWrapper = document.getElementById('address-input-wrapper');
            if (method === 'Pick Up') {
                addressWrapper.style.display = 'none';
            } else {
                addressWrapper.style.display = 'block';
            }
        };

        window.applySpellingCorrection = () => {
            const targetName = document.getElementById('edit-target-name').value.trim();
            const newName = document.getElementById('edit-new-name').value.trim();

            if (!targetName || !newName) {
                alert("Please fill in both the current name and the corrected spelling name.");
                return;
            }

            const matchedProduct = perfumes.find(p => p.name.toLowerCase() === targetName.toLowerCase());
            
            if (!matchedProduct) {
                alert("No match found for that product name. Please verify spelling accuracy.");
                return;
            }

            db.ref('perfumes/' + matchedProduct.firebaseId).update({ name: newName }, (err) => {
                if (!err) {
                    alert(`Spelling updated from "${matchedProduct.name}" to "${newName}" successfully!`);
                    document.getElementById('edit-target-name').value = '';
                    document.getElementById('edit-new-name').value = '';
                } else {
                    alert("Database patch rejected. Check your connection properties.");
                }
            });
        };

        window.applyDiscountToExisting = () => {
            const targetName = document.getElementById('discount-target-name').value.trim();
            const newPrice = document.getElementById('discount-new-base-price').value.trim();
            const pct = document.getElementById('discount-target-percentage').value.trim();

            if (!targetName || !pct) {
                alert("Please specify the exact Product Name and target Discount percentage value.");
                return;
            }

            const matchedProduct = perfumes.find(p => p.name.toLowerCase() === targetName.toLowerCase());
            
            if (!matchedProduct) {
                alert("No active matching product could be verified under that name. Check spelling accuracy.");
                return;
            }

            const updateData = { discountPercentage: pct };
            if (newPrice) updateData.price = newPrice;

            db.ref('perfumes/' + matchedProduct.firebaseId).update(updateData, (err) => {
                if (!err) {
                    alert(`Discount modifications injected accurately into ${matchedProduct.name}!`);
                    document.getElementById('discount-target-name').value = '';
                    document.getElementById('discount-new-base-price').value = '';
                    document.getElementById('discount-target-percentage').value = '';
                } else {
                    alert("Database write rejected. Verify network status permissions.");
                }
            });
        };

        window.showHome = () => {
            document.getElementById('home-content').style.display = 'block';
            document.getElementById('page-content').style.display = 'none';
        };

        window.showAbout = () => {
            document.getElementById('home-content').style.display = 'none';
            document.getElementById('page-content').style.display = 'block';
            document.getElementById('page-inner-content').innerHTML = `
                <h2 style="color:var(--accent-color); margin-bottom:15px; font-size:16px;">ABOUT US</h2>
                <p style="font-size:12px; color:#ccc; line-height:1.8;">Welcome to ARISA PERFUME STORE, Freetown's ultimate sanctuary for premium, high-fidelity luxury fragrance assets. We curate world-class aromatic solutions designed to leave an unforgettable imprint. Each product in our collection is authenticated to meet rigorous standard profiles of continuous projection and sophistication.</p>
            `;
        };

        window.showPolicy = () => {
            document.getElementById('home-content').style.display = 'none';
            document.getElementById('page-content').style.display = 'block';
            document.getElementById('page-inner-content').innerHTML = `
                <h2 style="color:var(--accent-color); margin-bottom:15px; font-size:16px;">STORE POLICY</h2>
                <p style="font-size:12px; color:#ccc; line-height:1.8;"><strong>Logistics & Delivery:</strong> We offer reliable scheduled dispatch coordinates throughout Freetown between 9:00 AM and 6:00 PM daily. Delivery fees are applied contextually based on your pinpointed location boundaries.<br><br><strong>Returns:</strong> Due to security parameters surrounding cosmetics safety benchmarks, all sales executed are definitive. Ensure testing profiles are confirmed before final payment settlement.</p>
            `;
        };

        window.sendSuggestion = () => {
            const input = document.getElementById('user-suggestion');
            if(!input.value.trim()) return;
            db.ref('suggestions').push(input.value.trim());
            input.value = '';
            alert("Suggestion securely logged into our system backend. Thank you!");
        };

        window.loginAdmin = () => {
            const password = prompt("Enter Administration Verification Key Password:");
            if (password === "ARISA2026") {
                sessionStorage.setItem('isArisaAdmin', 'true');
                document.getElementById('admin-panel').style.display = 'block';
                renderProducts();
            } else {
                alert("Authorization Denied.");
            }
        };

        window.logoutAdmin = () => {
            sessionStorage.removeItem('isArisaAdmin');
            document.getElementById('admin-panel').style.display = 'none';
            renderProducts();
        };

        window.toggleStatus = (id, currentStatus) => {
            const nextStatus = currentStatus === 'available' ? 'sold-out' : 'available';
            db.ref('perfumes/' + id).update({ status: nextStatus });
        };

        window.deleteProduct = (id) => {
            if(confirm("Permanently erase product inventory configuration block from node databases?")) {
                db.ref('perfumes/' + id).remove();
            }
        };

        window.adminUpload = () => {
            const name = document.getElementById('admin-p-name').value;
            const price = document.getElementById('admin-p-price').value;
            const discountPct = document.getElementById('admin-p-discount-percentage').value;
            const color = document.getElementById('admin-p-color').value;
            const status = document.getElementById('admin-p-status').value;
            const isArrival = document.getElementById('admin-p-arrival').value;
            const fileInput = document.getElementById('admin-p-file');

            if (!name || !price || !fileInput.files[0]) {
                alert("Name, regular base price structure and target image source must be defined.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgBase64 = e.target.result;
                const newProduct = {
                    name: name,
                    price: price,
                    discountPercentage: discountPct ? discountPct : "",
                    color: color ? color : "",
                    status: status,
                    isNewArrival: isArrival,
                    image: imgBase64
                };
                db.ref('perfumes').push(newProduct, (err) => {
                    if(!err) {
                        alert("Product metadata added successfully!");
                        document.getElementById('admin-p-name').value = '';
                        document.getElementById('admin-p-price').value = '';
                        document.getElementById('admin-p-discount-percentage').value = '';
                        document.getElementById('admin-p-color').value = '';
                        document.getElementById('admin-p-arrival').value = 'no';
                        fileInput.value = '';
                    }
                });
            };
            reader.readAsDataURL(fileInput.files[0]);
        };

        window.checkoutWhatsApp = () => {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const method = document.getElementById('order-method').value;
            let addr = document.getElementById('cust-address').value.trim();

            if (method === 'Pick Up') {
                addr = "Customer Pick Up Option Selected";
            }

            if(!name || !phone || (method === 'Delivery' && !addr) || cart.length === 0) {
                alert("Please fill your customer details completely and verify your cart before checkout.");
                return;
            }

            const timestamp = new Date().toLocaleString();
            const grandTotal = document.getElementById('cart-grand-total').innerText;

            let invoiceItemsHTML = '';
            let textMessageProducts = '';
            let systemBackupItems = [];

            cart.forEach((itm, index) => {
                const linePrice = itm.calculatedCartPrice ? itm.calculatedCartPrice : parseFloat(itm.price);
                invoiceItemsHTML += `
                    <div class="receipt-row">
                        <span>${index + 1}. ${itm.name} ${itm.color ? `(${itm.color})` : ''}</span>
                        <strong>${linePrice.toFixed(2)} NLE</strong>
                    </div>`;
                
                textMessageProducts += `• *${itm.name}* ${itm.color ? `(${itm.color})` : ''} - ${linePrice.toFixed(2)} NLE\n`;
                
                systemBackupItems.push({
                    name: itm.name,
                    color: itm.color ? itm.color : "",
                    activePrice: linePrice.toFixed(2)
                });
            });

            const payment = document.getElementById('payment-method').value;

            const receiptHTML = `
                <p style="font-size:11px; color:#aaa; margin-bottom:10px; text-align:center;">Date: ${timestamp}</p>
                <div style="margin-bottom:15px; font-size:12px; border-bottom:1px solid #222; padding-bottom:10px;">
                    <p><strong>Customer Name:</strong> ${name}</p>
                    <p><strong>Phone Line:</strong> ${phone}</p>
                    <p><strong>Order System:</strong> ${method}</p>
                    ${method === 'Delivery' ? `<p><strong>Address:</strong> ${addr}</p>` : ''}
                    <p><strong>Settlement Mode:</strong> ${payment}</p>
                </div>
                <div style="margin-top:10px;">
                    <p style="font-size:11px; font-weight:bold; color:var(--accent-color); margin-bottom:8px;">PURCHASED ESSENCES:</p>
                    ${invoiceItemsHTML}
                </div>
                <div style="border-top:1px dashed var(--accent-color); margin-top:15px; padding-top:10px; text-align:right;">
                    <p style="font-size:16px; font-weight:bold; color:var(--accent-color);">Grand Total: ${grandTotal} NLE</p>
                </div>
            `;

            // Validate nodes are available before pushing data layout blocks
            const rdNode = document.getElementById('receipt-details');
            const crdNode = document.getElementById('canvas-receipt-details');
            if(rdNode) rdNode.innerHTML = receiptHTML;
            if(crdNode) crdNode.innerHTML = receiptHTML;
            
            const rModal = document.getElementById('receipt-modal');
            if(rModal) rModal.style.display = 'flex';

            const newOrderRef = db.ref('orders').push();
            newOrderRef.set({
                timestamp: timestamp,
                customerName: name,
                customerPhone: phone,
                orderMethod: method,
                customerAddress: addr,
                paymentMethod: payment,
                grandTotal: grandTotal,
                items: systemBackupItems
            });

            setTimeout(() => {
                const canvasContainer = document.getElementById('receipt-capture-canvas');
                if (!canvasContainer) return;
                
                html2canvas(canvasContainer, { useCORS: true, allowTaint: true, scale: 2 }).then(canvas => {
                    const imgData = canvas.toDataURL('image/jpeg', 0.9);
                    
                    const opt = {
                        margin: 10,
                        filename: `ARISA-INVOICE-${Date.now()}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    const originalPdfArea = document.getElementById('pdf-invoice-area');
                    if(!originalPdfArea) return;
                    
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = "btn";
                    downloadBtn.id = "dynamic-pdf-download-btn";
                    downloadBtn.style.background = "#d4af37";
                    downloadBtn.style.color = "black";
                    downloadBtn.style.marginTop = "10px";
                    downloadBtn.innerText = "DOWNLOAD PDF INVOICE RECEIPT";
                    
                    downloadBtn.onclick = function() {
                        const actionBtn = document.getElementById('hide-pdf-btn');
                        const selfBtn = document.getElementById('dynamic-pdf-download-btn');
                        if(actionBtn) actionBtn.style.display = 'none';
                        if(selfBtn) selfBtn.style.display = 'none';

                        html2pdf().set(opt).from(originalPdfArea).save().then(() => {
                            if(actionBtn) actionBtn.style.display = 'block';
                            if(selfBtn) selfBtn.style.display = 'block';
                        });
                    };

                    if(!document.getElementById('dynamic-pdf-download-btn')) {
                        const closeBtn = document.getElementById('hide-pdf-btn');
                        originalPdfArea.insertBefore(downloadBtn, closeBtn);
                    }
                });
            }, 800);

            let waMessage = `*ARISA PERFUME STORE - NEW ORDER LUXURY INVOICE*\n`;
            waMessage += `-----------------------------------------\n`;
            waMessage += `*Date:* ${timestamp}\n\n`;
            waMessage += `*Customer Info:*\n`;
            waMessage += `Name: ${name}\n`;
            waMessage += `Phone: ${phone}\n`;
            waMessage += `Order Setup: ${method}\n`;
            if (method === 'Delivery') {
                waMessage += `Address: ${addr}\n`;
            }
            waMessage += `\n*Settlement Terms:*\n`;
            waMessage += `Payment Mode: ${payment}\n\n`;
            waMessage += `*Selected Products:*\n`;
            waMessage += textMessageProducts;
            waMessage += `\n-----------------------------------------\n`;
            waMessage += `*GRAND TOTAL:* *${grandTotal} NLE*\n\n`;
            waMessage += `_Invoice statement securely registered inside our database nodes via WhatsApp client redirect synchronization._`;

            const encodedMsg = encodeURIComponent(waMessage);
            const waURL = `https://wa.me/${myWhatsAppNumber}?text=${encodedMsg}`;
            
            cart = [];
            updateCartUI();
            document.getElementById('floating-cart-btn').style.display = 'none';
            toggleCart();

            window.open(waURL, '_blank');
        };

        window.closeReceipt = () => {
            document.getElementById('receipt-modal').style.display = 'none';
            const oldBtn = document.getElementById('dynamic-pdf-download-btn');
            if(oldBtn) oldBtn.remove();
            showHome();
        };
    </script>
</body>
</html>
