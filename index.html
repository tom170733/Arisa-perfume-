<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISA PERFUME STORE | Luxury Scents</title>
    <style>
        /* LUXURY BLACK AND GOLD THEME */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        body { background-color: #000000; color: #ffffff; line-height: 1.6; overflow-x: hidden; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #111; border-bottom: 2px solid #d4af37; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #d4af37; cursor: pointer; }
        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a { text-decoration: none; color: #ffffff; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; cursor: pointer; }
        .nav-links a:hover { color: #d4af37; }

        /* Admin Section Styling */
        #admin-panel { display: none; background: #111; padding: 30px 5%; border-bottom: 2px solid #d4af37; text-align: center; }
        .admin-input { padding: 10px; margin: 5px; border: 1px solid #d4af37; background: #000; color: #fff; width: 100%; max-width: 200px; }

        /* Search Section */
        .search-container { text-align: center; padding: 50px 5%; background: #0a0a0a; border-top: 1px solid #1a1a1a; margin-top: 40px; }
        .search-label { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; color: #d4af37; }
        .search-input { width: 100%; max-width: 500px; padding: 12px 20px; border: 1.5px solid #d4af37; background: #000; color: #fff; border-radius: 25px; outline: none; font-size: 14px; text-align: center; }

        /* Hero & Shop */
        .hero { height: 50vh; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&q=80&w=1500') no-repeat center center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 5px solid #d4af37; padding: 20px; }
        .hero h2 { font-size: 28px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; color: #d4af37; }
        .hero p { font-style: italic; font-size: 14px; color: #fff; }

        .container { padding: 40px 5%; background: #000; }
        .section-title { text-align: center; margin-bottom: 30px; font-size: 20px; text-transform: uppercase; letter-spacing: 3px; color: #d4af37; }

        /* Products Grid */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .product-card { background: #111; padding: 0 0 15px 0; text-align: center; border: 1px solid #1a1a1a; position: relative; }
        .product-image { width: 100%; height: 180px; background-color: #050505; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: contain; }
        
        .status-badge { position: absolute; top: 10px; right: 10px; padding: 3px 8px; font-size: 8px; font-weight: bold; text-transform: uppercase; z-index: 5; }
        .available { background-color: #d4af37; color: black; }
        .sold-out { background-color: #333; color: white; }
        .price { color: #d4af37; font-weight: bold; margin-bottom: 10px; font-size: 13px; display: block; }
        
        .btn { padding: 10px; background: #d4af37; color: black; font-weight: bold; text-transform: uppercase; font-size: 10px; border: none; cursor: pointer; width: 90%; transition: 0.3s; margin-bottom: 5px; }
        .btn:hover { background: #fff; }

        /* Suggestion Box */
        .suggestion-box { background: #111; padding: 40px 5%; border-top: 1px solid #d4af37; text-align: center; }
        .suggest-input { width: 100%; max-width: 500px; height: 80px; padding: 15px; background: #000; color: #fff; border: 1px solid #d4af37; margin-bottom: 10px; resize: none; }

        /* Cart Overlay */
        .cart-overlay { position: fixed; top: 0; right: 0; width: 100%; max-width: 350px; height: 100%; background: #111; color: white; z-index: 2000; box-shadow: -5px 0 15px rgba(0,0,0,0.5); padding: 20px; display: none; border-left: 4px solid #d4af37; overflow-y: auto; }
        .close-cart { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; color: #d4af37; }
        .cart-input { width: 100%; padding: 8px; border: 1px solid #d4af37; background: #000; color: white; margin-bottom: 12px; outline: none; font-size: 13px; }

        footer { background: #000; color: #555; text-align: center; padding: 40px 5%; border-top: 2px solid #1a1a1a; font-size: 12px; }

        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); } .product-image { height: 280px; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showHome()">ARISA</div>
        <ul class="nav-links">
            <li><a onclick="showHome()">Home</a></li>
            <li><a onclick="showAbout()">About</a></li>
            <li><a onclick="showPolicy()">Policy</a></li>
        </ul>
        <div onclick="toggleCart()" style="cursor:pointer; font-weight: bold; font-size: 13px; color: #d4af37;">
            BAG <span id="cart-counter" style="background:#d4af37; color:black; border-radius:50%; padding:1px 6px; font-size:10px;">0</span>
        </div>
    </nav>

    <div id="admin-panel">
        <h3 style="color:#d4af37; margin-bottom:15px;">ADMIN PANEL</h3>
        <input type="text" id="admin-p-name" class="admin-input" placeholder="Perfume Name">
        <input type="number" id="admin-p-price" class="admin-input" placeholder="Price (NLE)">
        <select id="admin-p-status" class="admin-input">
            <option value="available">Available</option>
            <option value="sold-out">Sold Out</option>
        </select>
        <input type="file" id="admin-p-file" class="admin-input" style="border:none;" accept="image/*">
        <br>
        <button class="btn" style="width: 200px;" onclick="adminUpload()">UPLOAD PRODUCT</button>
        <button class="btn" style="width: 200px; background:#333; color:#fff;" onclick="logoutAdmin()">LOGOUT</button>
    </div>

    <div id="cart-sidebar" class="cart-overlay">
        <div class="close-cart" onclick="toggleCart()">&times;</div>
        <h3 style="text-transform: uppercase; margin-bottom: 15px; font-size: 18px; color: #d4af37;">Your Selection</h3>
        <div id="cart-items-list"></div>
        <div style="font-size: 13px; margin-top: 10px; border-top: 1px solid #222; padding-top: 10px;">
            <div style="display: flex; justify-content: space-between;">
                <span>Subtotal:</span>
                <span><span id="cart-subtotal">0</span> NLE</span>
            </div>
            <div id="discount-row" style="display: none; justify-content: space-between; color: #d4af37; font-weight: bold; margin-top: 5px;">
                <span id="discount-text">Multi-buy Discount:</span>
                <span>-<span id="cart-discount">0</span> NLE</span>
            </div>
            <div style="font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; margin: 15px 0; border-top: 1px solid #d4af37; padding-top: 10px;">
                <span>Total:</span>
                <span style="color: #d4af37;"><span id="cart-grand-total">0</span> NLE</span>
            </div>
        </div>
        <div class="cart-form">
            <input type="text" id="cust-name" class="cart-input" placeholder="Full Name">
            <input type="text" id="cust-address" class="cart-input" placeholder="Delivery Address">
        </div>
