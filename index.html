<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISA COLLECTION | PROFESSIONAL SHOWROOM</title>
    
    <!-- Core Firebase SDK Modules -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-primary: #ff6b8b; 
            --accent-light: #fff1f2;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 80px;
            transition: background-color 0.3s ease;
        }

        #app-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0f19;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }
        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glow-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid #ff6b8b;
            border-right: 4px solid #ff477e;
            box-shadow: 0 0 15px rgba(255, 107, 139, 0.5);
            animation: spinNeon 1.2s linear infinite;
        }
        .loading-text {
            position: absolute;
            color: #ff6b8b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        @keyframes spinNeon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        header {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        header h1 {
            color: var(--text-dark);
            font-size: 22px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 14px;
        }
        header h1 span { color: var(--accent-primary); }
        
        /* Navigation with Active Line Indicator */
        nav { display: flex; justify-content: center; gap: 24px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            padding-bottom: 6px;
        }
        nav a.active { color: var(--text-dark); }
        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-primary);
        }

        /* Section Bar with Active Line Indicator */
        .section-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }
        .sec-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            flex: 1;
            max-width: 180px;
            text-align: center;
            position: relative;
        }
        .sec-btn.active {
            background: var(--text-dark);
            color: #ffffff;
            border-color: var(--text-dark);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px 8px; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }
        .product-image {
            width: 100%;
            height: 160px;
            background: #f8fafc;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .status-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 700;
            z-index: 2;
        }
        .status-badge.available { background: #e2f8f0; color: #065f46; }
        .status-badge.sold-out { background: #fee2e2; color: #991b1b; }
        
        .new-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 700;
            background: var(--accent-primary);
            color: #ffffff;
            z-index: 2;
        }
        .product-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-container { margin-top: auto; padding-top: 4px; display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
        .price-current { font-weight: 800; font-size: 14px; color: var(--text-dark); }
        .price-old { text-decoration: line-through; color: var(--text-muted); font-size: 10px; }
        
        .btn {
            background: var(--accent-primary);
            border: none;
            color: #ffffff;
            width: 100%;
            padding: 10px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

        #floating-cart-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--text-dark);
            color: #ffffff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: none;
        }
        #floating-cart-counter {
            position: absolute;
            top: -2px;
            left: -2px;
            background: var(--accent-primary);
            color: white;
            font-size: 9px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #ffffff;
            border-left: 1px solid var(--border-color);
            z-index: 300;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        .close-sidebar-btn { background: transparent; border: none; font-size: 26px; color: var(--text-muted); cursor: pointer; }
        
        .cart-scroll-area { flex-grow: 1; overflow-y: auto; margin-bottom: 16px; }
        .cart-item-row { border-bottom: 1px solid var(--border-color); padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .remove-item-btn { background: transparent; border: none; color: #dc2626; font-size: 11px; font-weight: 700; margin-top: 4px; display: block; cursor: pointer; }
        
        .checkout-inputs { background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .checkout-inputs input { width: 100%; padding: 8px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 10px; outline: none; }
        
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        
        .admin-box { background: #ffffff; border: 2px solid var(--accent-primary); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        .admin-grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
        .admin-grid-inputs input, .admin-grid-inputs select, .admin-grid-inputs textarea { border: 1px solid #cbd5e1; padding: 9px; font-size: 12px; border-radius: 6px; outline: none; width: 100%; }

        /* Color Theme Picker Widget */
        .color-picker-box {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 20px;
            z-index: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }
        .color-picker-box input[type="color"] {
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
    </style>
</head>
<body>

    <!-- Background Theme Customizer Tool -->
    <div class="color-picker-box">
        <span style="font-size:10px; font-weight:700;">Theme:</span>
        <input type="color" id="bg-color-picker" onchange="changeBackgroundTheme(this.value)" value="#f8fafc">
    </div>

    <!-- Preloader Screen -->
    <div id="app-preloader">
        <div class="spinner-container">
            <div class="glow-ring"></div>
            <div class="loading-text">LOADING</div>
        </div>
    </div>

    <!-- Main Store Header -->
    <header>
        <h1 onclick="switchTab('home', document.getElementById('nav-home'))">ARISA <span>COLLECTION</span></h1>
        <nav>
            <a onclick="switchTab('home', this)" id="nav-home" class="active">HOME</a>
            <a onclick="switchTab('about', this)" id="nav-about">ABOUT</a>
            <a onclick="switchTab('policy', this)" id="nav-policy">POLICY</a>
            <a onclick="toggleCart()">CART (<span id="cart-counter">0</span>)</a>
        </nav>
    </header>

    <!-- Navigation Section Bar -->
    <div class="section-bar" id="category-section-bar">
        <button type="button" class="sec-btn active" id="sec-perfume" onclick="switchSection('perfume', this)">Perfumes & Body Care</button>
        <button type="button" class="sec-btn" id="sec-clothing" onclick="switchSection('clothing', this)">Clothing & Apparel</button>
    </div>

    <div class="container">
        <div id="home-content">
            
            <!-- Live Secure Control Console (Admin Panel) -->
            <div id="admin-panel" class="admin-box" style="display:none;">
                <h2 style="font-size: 12px; margin-bottom: 12px; text-transform: uppercase; color:var(--accent-primary); font-weight:800;">ARISA SECURE STORAGE MANAGER & EDITOR</h2>
                
                <p style="font-size:11px; font-weight:700; margin-bottom:6px;">Add New Product / Item</p>
                <div class="admin-grid-inputs">
                    <input type="text" id="admin-p-name" placeholder="Product Name">
                    <input type="number" id="admin-p-price" placeholder="Price (NLE)">
                    <input type="text" id="admin-p-img-link" placeholder="Image URL (or upload below)">
                    <input type="number" id="admin-p-discount-percentage" placeholder="Discount % (Optional)">
                    <select id="admin-p-status">
                        <option value="available">Available</option>
                        <option value="sold-out">Sold Out</option>
                    </select>
                    <select id="admin-p-arrival">
                        <option value="no">Regular Stock</option>
                        <option value="yes">New Arrival</option>
                    </select>
                    <select id="admin-p-category">
                        <option value="perfume">Perfumes & Body Care</option>
                        <option value="clothing">Clothing & Apparel</option>
                    </select>
                </div>
                <!-- Picture File Upload Helper -->
                <div style="margin-bottom:12px;">
                    <label style="font-size:10px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Upload Picture From Phone/PC:</label>
                    <input type="file" id="admin-img-file" accept="image/*" style="font-size:11px;" onchange="convertImageFile(event)">
                </div>

                <div style="display:flex; gap:10px; margin-bottom:16px;">
                    <button type="button" class="btn" style="background:var(--text-dark); padding:10px;" onclick="adminUploadSecureLink()">PUBLISH LIVE TO STORE</button>
                    <button type="button" class="btn" style="background:#e2e8f0; color:var(--text-dark); padding:10px; max-width:100px;" onclick="logoutAdmin()">EXIT</button>
                </div>

                <hr style="border:0; border-top:1px solid var(--border-color); margin:16px 0;">

                <p style="font-size:11px; font-weight:700; margin-bottom:6px;">Edit Store Pages (About & Policy)</p>
                <div style="display:grid; gap:8px;">
                    <textarea id="admin-about-text" rows="2" placeholder="Edit About page text content..."></textarea>
                    <button type="button" class="btn" style="background:#2563eb; font-size:10px; padding:6px;" onclick="saveSettingContent('about')">Update About Page</button>
                    
                    <textarea id="admin-policy-text" rows="2" placeholder="Edit Policy page text content..."></textarea>
                    <button type="button" class="btn" style="background:#2563eb; font-size:10px; padding:6px;" onclick="saveSettingContent('policy')">Update Policy Page</button>
                </div>
            </div>

            <!-- Showcase Catalogue Display Grid -->
            <div class="product-grid" id="products-catalogue-grid"></div>
            
            <!-- Hidden admin security login trigger door -->
            <div style="text-align:center; margin-top:60px; padding: 20px; opacity: 0.1;" onclick="handleSecretAdminTap()">
                <span style="font-size: 10px; cursor: pointer;">[ TAP HERE 3 TIMES FOR ADMIN PORTAL ]</span>
            </div>
        </div>

        <!-- Info Secondary Subpages Frame (About / Policy) -->
        <div id="page-content" style="display:none; background:var(--card-bg); border:1px solid var(--border-color); padding:24px; border-radius:8px;">
            <div id="page-inner-content"></div>
        </div>
    </div>

    <!-- Sticky Cart Drawer Shortcut Badge -->
    <button type="button" id="floating-cart-btn" onclick="toggleCart()">🛍️ <span id="floating-cart-counter">0</span></button>

    <!-- Shopping Bag Sidebar Panel Overlay -->
    <div class="sidebar" id="cart-sidebar">
        <div class="sidebar-header">
            <h2 style="font-size:16px; font-weight:800;">SHOPPING BAG</h2>
            <button type="button" class="close-sidebar-btn" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-scroll-area"><div id="cart-items-list"></div></div>
        <div class="checkout-inputs">
            <input type="text" id="cust-name" placeholder="Your Name">
            <input type="tel" id="cust-phone" placeholder="WhatsApp Number">
        </div>
        <div style="margin-bottom: 16px;">
            <div class="summary-row"><span>Subtotal:</span><strong><span id="cart-subtotal">0.00</span> NLE</strong></div>
            <div class="summary-row" style="color: #059669;"><span>Discount Applied:</span><strong><span id="cart-discount-label">0%</span></strong></div>
            <hr style="border:0; border-top:1px solid var(--border-color); margin:8px 0;">
            <div class="summary-row" style="font-size:15px;"><span>Total Due:</span><strong><span id="cart-grand-total">0.00</span> NLE</strong></div>
        </div>
        <button type="button" class="btn" style="padding:12px;" onclick="checkoutWhatsApp()">ORDER ON WHATSAPP</button>
    </div>

    <script>
        const myWhatsAppNumber = "23274170733"; 

        // 🔴 PASTE YOUR ACTUAL FIREBASE CONFIG DETAILS HERE:
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "arisa-perfume-store.firebaseapp.com",
            databaseURL: "https://arisa-perfume-store-default-rtdb.firebaseio.com/",
            projectId: "arisa-perfume-store",
            storageBucket: "arisa-perfume-store.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize App Network Services
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const catalogRef = database.ref('perfumes');
        const settingsRef = database.ref('settings');

        const SECURITY_PASS_KEY = "AMIRA_SECURE_KEY_2026"; 

        let itemsCollection = []; 
        let storeSettings = { about: "Welcome to Arisa Collection premium showroom.", policy: "Standard delivery terms apply." };
        let cart = [];
        let currentSection = 'perfume'; 
        let secretClickCount = 0;
        let uploadedImageBase64 = "";

        // Real-time synchronization listeners
        catalogRef.on('value', (snapshot) => {
            const data = snapshot.val();
            itemsCollection = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderProducts();
            hidePreloader();
        });

        settingsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                if(data.about) storeSettings.about = data.about;
                if(data.policy) storeSettings.policy = data.policy;
            }
        });

        function hidePreloader() {
            const preloader = document.getElementById('app-preloader');
            if(preloader) {
                preloader.style.opacity = '0';
                setTimeout(() => preloader.style.display = 'none', 400);
            }
        }

        // Handle Image File conversion for local phone/PC uploads
        function convertImageFile(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    uploadedImageBase64 = reader.result;
                    document.getElementById('admin-p-img-link').value = "[Image Uploaded Successfully]";
                }
                reader.readAsDataURL(file);
            }
        }

        // Tab Switching with Active Bottom Line Line Indicator
        window.switchTab = function(tabName, element) {
            document.querySelectorAll('header nav a').forEach(a => a.classList.remove('active'));
            if(element) element.classList.add('active');

            if(tabName === 'home') {
                document.getElementById('home-content').style.display = 'block';
                document.getElementById('category-section-bar').style.display = 'flex';
                document.getElementById('page-content').style.display = 'none';
            } else {
                document.getElementById('home-content').style.display = 'none';
                document.getElementById('category-section-bar').style.display = 'none';
                document.getElementById('page-content').style.display = 'block';
                
                const title = tabName.toUpperCase();
                const text = storeSettings[tabName] || "Information loading...";
                document.getElementById('page-inner-content').innerHTML = `<h2 style="font-size:18px; margin-bottom:12px; font-weight:800; color:var(--text-dark);">${title}</h2><p style="font-size:13px; line-height:1.6; color:var(--text-muted);">${text}</p>`;
            }
        };

        // Section Switching (Perfumes vs Clothing) with Active Line
        window.switchSection = function(sectionName, element) {
            currentSection = sectionName;
            document.querySelectorAll('.sec-btn').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
            renderProducts();
        };

        function handleSecretAdminTap() {
            secretClickCount++;
            if (secretClickCount >= 3) {
                secretClickCount = 0;
                loginAdmin();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('products-catalogue-grid');
            if(!grid) return;
            grid.innerHTML = '';
            const isAdmin = sessionStorage.getItem('isArisaAdmin') === 'true';
            const filteredItems = itemsCollection.filter(item => item.category === currentSection);

            if (filteredItems.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; font-size:12px; color:var(--text-muted); text-align:center; padding:48px 0;">No items found in this category.</p>`;
                return;
            }

            filteredItems.forEach(p => {
                const sold = p.status === 'sold-out';
                const originalPrice = parseFloat(p.price);
                let priceHTML = `<span class="price-current">${originalPrice.toFixed(2)} NLE</span>`;

                if (p.discountPercentage && parseFloat(p.discountPercentage) > 0) {
                    let pct = parseFloat(p.discountPercentage);
                    let finalPrice = originalPrice - (originalPrice * (pct / 100));
                    priceHTML = `<span class="price-current">${finalPrice.toFixed(2)} NLE</span> <span class="price-old">${originalPrice.toFixed(2)} NLE</span>`;
                }

                grid.innerHTML += `
                    <div class="product-card" onclick="${sold ? '' : `directAddToCart('${p.id}')`}">
                        <span class="status-badge ${p.status}">${p.status}</span>
                        ${p.isNewArrival === 'yes' ? '<span class="new-badge">NEW</span>' : ''}
                        <div class="product-image"><img src="${p.image || 'https://via.placeholder.com/150'}"></div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="price-container">${priceHTML}</div>
                            <button type="button" class="btn" ${sold ? 'disabled' : ''}>${sold ? 'OUT OF STOCK' : 'ADD TO CART'}</button>
                        </div>
                        ${isAdmin ? `<div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:8px; z-index:10;">
                            <button type="button" class="btn" style="background:#dc2626; font-size:9px;" onclick="event.stopPropagation(); deleteProductLive('${p.id}', event)">Delete</button>
                            <button type="button" class="btn" style="background:#2563eb; font-size:9px;" onclick="event.stopPropagation(); toggleStatusLive('${p.id}', event)">Toggle Status</button>
                        </div>
                        <div style="margin-top:6px; display:flex; gap:4px; z-index:10;">
                            <input type="text" id="quick-rename-${p.id}" value="${p.name}" style="font-size:10px; padding:4px; border:1px solid #cbd5e1; border-radius:4px; width:100%;" onclick="event.stopPropagation()">
                            <button type="button" class="btn" style="background:#059669; font-size:9px; padding:4px 8px;" onclick="event.stopPropagation(); quickUpdateName('${p.id}')">Rename</button>
                        </div>` : ''}
                    </div>`;
            });
        }

        window.directAddToCart = (productId) => {
            const item = itemsCollection.find(p => p.id === productId);
            if (!item || item.status === 'sold-out') return;
            cart.push({ ...item, cartId: Date.now() }); 
            updateCartUI();
            document.getElementById('floating-cart-btn').style.display = 'block';
        };

        window.removeCartItem = (cartId) => {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartUI();
            if (cart.length === 0) document.getElementById('floating-cart-btn').style.display = 'none';
        };

        // Professional Pricing & Discount Engine (5% for 2 items, 10% for 3+ items)
        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            document.getElementById('floating-cart-counter').innerText = cart.length;
            
            let subtotal = 0;
            const list = document.getElementById('cart-items-list');
            list.innerHTML = cart.map(i => {
                const price = parseFloat(i.price);
                subtotal += price;
                return `<div class="cart-item-row"><div><h4>${i.name}</h4><button type="button" class="remove-item-btn" onclick="removeCartItem(${i.cartId})">Remove</button></div><span>${price.toFixed(2)} NLE</span></div>`;
            }).join('');

            let discountRate = 0;
            let discountText = "0%";
            if (cart.length >= 3) {
                discountRate = 0.10; // 10% off for 3 or more items
                discountText = "10% (3+ Items)";
            } else if (cart.length === 2) {
                discountRate = 0.05; // 5% off for 2 items
                discountText = "5% (2 Items)";
            }

            let grandTotal = subtotal - (subtotal * discountRate);

            document.getElementById('cart-subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('cart-discount-label').innerText = discountText;
            document.getElementById('cart-grand-total').innerText = grandTotal.toFixed(2);
        }

        window.adminUploadSecureLink = function() {
            const name = document.getElementById('admin-p-name').value.trim();
            const price = document.getElementById('admin-p-price').value.trim();
            const imgLink = uploadedImageBase64 || document.getElementById('admin-p-img-link').value.trim();
            const discountPct = document.getElementById('admin-p-discount-percentage').value.trim() || "0";
            const status = document.getElementById('admin-p-status').value;
            const isArrival = document.getElementById('admin-p-arrival').value;
            const category = document.getElementById('admin-p-category').value;
            
            if (!name || !price || !imgLink) { 
                alert("Please provide the Name, Price, and an Image."); 
                return; 
            }

            const newProductRef = catalogRef.push(); 
            newProductRef.set({
                name: name,
                price: price,
                discountPercentage: discountPct,
                status: status,
                isNewArrival: isArrival,
                category: category,
                image: imgLink,
                secretAdminKey: SECURITY_PASS_KEY 
            }, (error) => {
                if (!error) {
                    document.getElementById('admin-p-name').value = '';
                    document.getElementById('admin-p-price').value = '';
                    document.getElementById('admin-p-img-link').value = '';
                    document.getElementById('admin-p-discount-percentage').value = '';
                    uploadedImageBase64 = "";
                    document.getElementById('admin-img-file').value = "";
                    alert("Product published live successfully!");
                } else {
                    alert("Database Blocked Write Request: " + error.message);
                }
            });
        };

        window.deleteProductLive = function(id, event) {
            if(event) event.stopPropagation();
            if(confirm("Permanently wipe item from live catalogs?")) {
                database.ref('perfumes/' + id).update({
                    secretAdminKey: SECURITY_PASS_KEY
                }).then(() => {
                    database.ref('perfumes/' + id).remove();
                });
            }
        };

        window.toggleStatusLive = function(id, event) {
            if(event) event.stopPropagation();
            const item = itemsCollection.find(p => p.id === id);
            if(item) {
                const nextStatus = item.status === 'available' ? 'sold-out' : 'available';
                database.ref('perfumes/' + id).update({ 
                    status: nextStatus,
                    secretAdminKey: SECURITY_PASS_KEY
                });
            }
        };

        window.quickUpdateName = function(id) {
            const inputField = document.getElementById(`quick-rename-${id}`);
            if(!inputField) return;
            const newName = inputField.value.trim();
            if(!newName) { alert("Name cannot be empty."); return; }

            database.ref('perfumes/' + id).update({
                name: newName,
                secretAdminKey: SECURITY_PASS_KEY
            }, (error) => {
                if(!error) alert("Product name updated successfully!");
                else alert("Error updating name: " + error.message);
            });
        };

        window.saveSettingContent = function(type) {
            const textVal = document.getElementById(`admin-${type}-text`).value.trim();
            if(!textVal) return;
            
            settingsRef.update({
                [type]: textVal,
                secretAdminKey: SECURITY_PASS_KEY
            }, (error) => {
                if(!error) alert(`${type.toUpperCase()} page updated successfully!`);
                else alert("Error: " + error.message);
            });
        };

        window.changeBackgroundTheme = function(colorHex) {
            document.body.style.backgroundColor = colorHex;
        };

        window.toggleCart = () => {
            const el = document.getElementById('cart-sidebar');
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
        };

        window.loginAdmin = () => {
            const pass = prompt("Enter Admin Password:");
            if (pass === "AMIRA") {
                sessionStorage.setItem('isArisaAdmin', 'true');
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('admin-about-text').value = storeSettings.about;
                document.getElementById('admin-policy-text').value = storeSettings.policy;
                renderProducts();
                alert("Admin Access Granted.");
            } else if(pass !== null) {
                alert("Incorrect password.");
            }
        };

        window.logoutAdmin = () => {
            sessionStorage.removeItem('isArisaAdmin');
            document.getElementById('admin-panel').style.display = 'none';
            renderProducts();
        };

        window.checkoutWhatsApp = () => {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const grandTotal = document.getElementById('cart-grand-total').innerText;
            const discountLabel = document.getElementById('cart-discount-label').innerText;
            
            if(!name || !phone || cart.length === 0) {
                alert("Please fill in your Name and WhatsApp phone number.");
                return;
            }

            let msg = `*ARISA COLLECTION ORDER*\nCustomer: ${name}\nPhone: ${phone}\nDiscount Applied: ${discountLabel}\nTotal Due: ${grandTotal} NLE\n\n*Ordered Items:*\n`;
            cart.forEach(i => { msg += `• ${i.name} (${i.price} NLE)\n`; });

            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(msg)}`, '_blank');
            cart = []; updateCartUI(); toggleCart();
        };
    </script>
</body>
</html>
